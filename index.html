          </g>

          {placed.map(s => {

                  const sx = lineFrom(s, pid, dx);

                      {!isTravel ? <circle cx={dx} cy={y1} r={st.w / 2 + 2} fill="var(--surface)" stroke={col} strokeWidth="2.5" strokeOpacity={st.op * d} /> : null}
                      {!isTravel ? <circle cx={dx} cy={y2} r={st.w / 2 + 2} fill="var(--surface)" stroke={col} strokeWidth="2.5" strokeOpacity={st.op * d} /> : null}

                    </g>

                })}

          })}

          {shownSubEvents.map(m => {
            if (density === "key" && m.duration === 0 && !m.pinned) return null;
            const host = byEvent[m.event]; const r = resolved[m.id];
            const y1 = yFor(r.start), y2 = yFor(r.end != null ? r.end : r.start);
            const isSpan = m.duration > 0 && y2 > y1 + 0.5; const sel = selId === m.id;
            const pids = (m.parties || []).filter(pid => rankOf[pid] != null && (host.parties || []).includes(pid));
            if (!pids.length) return null;

                })() : null}
              </g>
            );
          })}

          {placed.map(s => {
            const sel = selId === s.id; if (!sel && (!showLabels || highlight)) return null;
            const r = resolved[s.id]; const name = eventName(s, places);
            const tm = sel ? " · " + fmtTime(r.start) : "";   /* the time shows only on the selected label, the axis carries it otherwise */
            const pids = (s.parties || []).filter(p => rankOf[p] != null);
            if (s.type === "travel") {
              /* travel is named along its own diagonal, on the outer side of the bundle, and drops to an upright label beside steep legs */
              if (!pids.length) return null;
              const y1 = yFor(r.start), y2 = yFor(r.end);
              const legs = pids.map(pid => { const dx = xAt(s, pid); return { sx: lineFrom(s, pid, dx), dx }; });
              const ref = legs.reduce((a, b) => ((b.sx + b.dx) > (a.sx + a.dx) ? b : a));
              const mx = (ref.sx + ref.dx) / 2, my = (y1 + y2) / 2;
              let vx = ref.dx - ref.sx, vy = y2 - y1; if (vx < 0) { vx = -vx; vy = -vy; }   /* read left to right */
              const deg = Math.atan2(vy, vx) * 180 / Math.PI; const len = Math.hypot(vx, vy);
              if (Math.abs(deg) <= 50 && len > 60) {

                  <text key={"lbl" + s.id} className={"lbl lbl-tr" + (sel ? " sel" : "")} textAnchor="middle" transform={"translate(" + mx + " " + my + ") rotate(" + deg + ")"} y={up ? -8 : 15}>{shown}{sel ? <tspan className="lbl-time">{tm}</tspan> : null}</text>
                );
              }
              const lx = mx + 10; const shown = fitText(name, sel ? 280 : colRightEdge(s.location) - lx - 6, PER_TR);
              return (
                <text key={"lbl" + s.id} className={"lbl lbl-tr" + (sel ? " sel" : "")} x={lx} y={my + 4.5}>{shown}{sel ? <tspan className="lbl-time">{tm}</tspan> : null}</text>
              );
            }
            const offs = pids.map(p => trackOff(p));
            const rightX = colX(colIndex[s.location]) + (offs.length ? Math.max(...offs) : 0);
            const y = yFor(r.start); const lx = rightX + 10;
            const shown = fitText(name, sel ? 280 : colRightEdge(s.location) - lx - 6, PER_EV);
            return (
              <text key={"lbl" + s.id} className={"lbl lbl-ev" + (sel ? " sel" : "")} x={lx} y={y + 5}>{shown}{sel ? <tspan className="lbl-time">{tm}</tspan> : null}</text>
            );
          })}

          {drag && resolved[drag.id] && resolved[drag.id].start != null ? (() => {
            const s = byEvent[drag.id]; const r = resolved[drag.id]; const txt = fmtTime(r.start) + " to " + fmtTime(r.end);
            const cx = colX(colIndex[s.location]); const w = txt.length * 6.6 + 20; const y = yFor(r.start) - 30;
            return (
              <g style={{ pointerEvents: "none" }}>
                <rect x={cx - w / 2} y={y} width={w} height={22} rx={11} style={{ fill: "var(--accent)" }} />
                <text x={cx} y={y + 15} textAnchor="middle" fontSize="13.5" fontWeight="700" style={{ fill: "#fff" }}>{txt}</text>
              </g>
            );
          })() : null}

          {focusParty ? focusLabels.map(it => {
            const w = it.text.length * PER_CHAR + 14;
            return (
              <g key={"fl" + it.id} style={{ pointerEvents: "none" }}>
                <line x1={it.x} y1={it.y} x2={it.x + 9} y2={it.ly} style={{ stroke: colorOf[focusParty] || "var(--ink)" }} strokeWidth="1" strokeOpacity="0.6" />
                <rect x={it.x + 9} y={it.ly - 10} width={w} height={20} rx={5} style={{ fill: "var(--surface)", stroke: colorOf[focusParty] || "var(--border)" }} strokeWidth="1.3" />
                <text x={it.x + 16} y={it.ly + 4.5} fontSize="14" fontWeight="700" style={{ fill: "var(--ink)" }}>{it.text}</text>
              </g>
            );
          }) : null}

        </svg>
      </div>

      {skipped > 0 ? (<p className="map-note">{skipped} {skipped === 1 ? "row is" : "rows are"} not shown because they have no time, no place, or no event to sit on.</p>) : null}

      <div className="legend">
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="7" strokeLinecap="round" /></svg> confirmed</span>
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="5" strokeOpacity="0.62" strokeLinecap="round" /></svg> {editableProp ? "tentative" : "to be confirmed"}</span>
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="5" strokeDasharray="10 7" strokeLinecap="round" /></svg> {editableProp ? "still to book" : "details still open"}</span>
        <span className="li"><svg width="40" height="16" aria-hidden="true"><line x1="4" y1="13" x2="36" y2="3" style={{ stroke: "var(--ink)" }} strokeWidth="3" strokeLinecap="round" /></svg> travel between places</span>
        <span className="li"><svg width="18" height="14" aria-hidden="true"><circle cx="9" cy="7" r="4.5" style={{ fill: "var(--surface)", stroke: "var(--ink)" }} strokeWidth="2" /></svg> moment on a line</span>
        <span className="li"><svg width="18" height="14" aria-hidden="true"><circle cx="9" cy="7" r="4.5" style={{ fill: "var(--surface)", stroke: "var(--ink)" }} strokeWidth="3.4" /></svg> fixed-time moment</span>
        <span className="li"><svg width="18" height="14" aria-hidden="true"><circle cx="9" cy="7" r="3.2" style={{ fill: "var(--surface)", stroke: "var(--ink)" }} strokeWidth="1.6" strokeOpacity="0.7" /></svg> where a moment ends</span>
        <span className="li"><svg width="18" height="14" aria-hidden="true"><circle cx="9" cy="7" r="3.4" style={{ fill: "var(--ink)" }} /></svg> call time, where the line starts</span>
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="2.5" strokeOpacity="0.32" strokeDasharray="1 7" strokeLinecap="round" /></svg> continues, not planned</span>
      </div>
    </div>
  );
}

/* ================= Timeline helpers ================= */
const STATUS_LABEL = { confirmed: "Confirmed", provisional: "Tentative", unbooked: "Still to book" };
function statusText(st, viewer) { return st === "confirmed" ? "Confirmed" : (viewer ? "To be confirmed" : (STATUS_LABEL[st] || st)); }
function fmtDur(m) { m = m || 0; const h = Math.floor(m / 60), mm = m % 60; if (!h && !mm) return "0 min"; return (h ? h + " hr" : "") + (h && mm ? " " : "") + (mm ? mm + " min" : ""); }
function timeParts(mins) { const m = ((mins % 1440) + 1440) % 1440; const h = Math.floor(m / 60); return { n: (h % 12 || 12) + ":" + String(m % 60).padStart(2, "0"), ap: h < 12 ? "am" : "pm" }; }
function cardTitle(s, places) {
  if (s.label) return s.label;

  return p ? p.name : "Untitled event";
}

];

/* ================= Timeline (cards on a time rail) ================= */
function TimelineView({ events, subEvents, parties, places, resolved, warningsById, selId, onSelect, viewer, viewAs, onAddEvent }) {
  const partyById = {}; parties.forEach(p => { partyById[p.id] = p; });
  const placeById = {}; places.forEach(p => { placeById[p.id] = p; });
  const startOf = s => { const r = resolved[s.id]; return (r && r.start != null) ? r.start : 1e9; };
  const items = events.filter(s => !viewAs || (s.parties || []).includes(viewAs)).slice().sort((a, b) => startOf(a) - startOf(b));
  const bucketOf = s => { const st = startOf(s); if (st >= 1e9) return "unscheduled"; const d = TIMELINE_SECTIONS.find(x => x.test && x.test(st)); return d ? d.key : "evening"; };

  if (!events.length) {
    return (
      <div className="tl-empty">
        <p className="tl-empty-title">{viewer ? "The schedule is not published yet." : "Your day starts here."}</p>
        <p>{viewer ? "Nicole and Michael will share it soon." : "Add your first event, like hair and makeup or the ceremony, and it will appear here as a card."}</p>
        {!viewer ? <button className="btn primary" onClick={() => onAddEvent({})}>{ICONS.plus}Add your first event</button> : null}
      </div>
    );
  }
  if (!items.length) return <div className="tl-empty"><p>Nothing on the schedule for this group yet.</p></div>;

  const whoText = s => (s.parties || []).map(pid => partyById[pid]).filter(Boolean);

  return (
    <div className="tl-list">
      {TIMELINE_SECTIONS.map(sec => {
        const rows = items.filter(s => bucketOf(s) === sec.key);
        if (!rows.length) return null;
        return (
          <section className="sec" key={sec.key} aria-label={sec.label}>
            <h2 className="sec-h">{sec.label}</h2>
            {rows.map((s, idx) => {
              const r = resolved[s.id] || {}; const has = r.start != null;
              const tp = has ? timeParts(r.start) : null;
              const travel = s.type === "travel";
              const place = placeById[s.location] || null;
              const title = cardTitle(s, places);
              const w = warningsById[s.id] || [];
              const sel = selId === s.id ? " sel" : "";
              const first = idx === 0 ? " first" : "";
              const untilTxt = (has && r.end != null && s.duration > 0 && !travel) ? "until " + fmtTime(r.end) : "";
              const nodeCls = "node" + (s.status === "provisional" ? " tentative" : s.status === "unbooked" ? " unbooked" : "");
              const when = (
                <div className="when">
                  {has ? (<React.Fragment><span className="t">{tp.n}</span><span className="ap">{tp.ap}</span>{untilTxt ? <span className="u">{untilTxt}</span> : null}</React.Fragment>) : <span className="t nt">{"–"}</span>}
                </div>
              );
              if (travel) {
                return (
                  <div className={"row trip" + sel + first} key={s.id}>
                    {when}
                    <div className="lane"><span className="node"></span></div>
                    <div>
                      <button type="button" className="trip-btn" onClick={() => onSelect(s.id)} aria-label={title + (has ? ", " + fmtTime(r.start) : "") + ", " + fmtDur(s.duration)}>
                        <span className="tt">{ICONS.car}{title}</span>
                        <span className="tm">{fmtDur(s.duration)}</span>
                        <span className="tm tm-who">{whoText(s).map(p => <span key={p.id}><i className="pdot" style={{ background: p.color }}></i>{p.name}</span>)}</span>
                        {!viewer && w.length ? <span className="tm tm-warn">{"▲"} Needs a look</span> : null}
                      </button>
                    </div>
                  </div>
                );
              }
              const moments = subEvents.filter(m => m.event === s.id && (!viewAs || (m.parties || []).includes(viewAs)))
                .slice().sort((a, b) => startOf(a) - startOf(b));
              const shown = moments.slice(0, 4); const more = moments.length - shown.length;
              return (
                <div className={"row" + sel + first} key={s.id}>
                  {when}
                  <div className="lane"><span className={nodeCls}></span></div>
                  <div>
                    <button type="button" className="card" onClick={() => onSelect(s.id)}>
                      <div className="card-top">
                        <div>
                          <h3>{title}</h3>
                          {s.label && place ? <div className="where">{ICONS.pin}<span>{place.name}{untilTxt ? <span className="until-inline">{" · " + untilTxt}</span> : null}</span></div>
                            : (untilTxt ? <div className="where until-only">{untilTxt}</div> : null)}
                        </div>
                        {s.status !== "confirmed" ? <span className={"badge s-" + s.status}>{statusText(s.status, viewer)}</span> : null}
                      </div>
                      {whoText(s).length ? <div className="wholine">{whoText(s).map(p => <span key={p.id}><i className="pdot" style={{ background: p.color }}></i>{p.name}</span>)}</div> : null}
                      {shown.length ? (
                        <ul className="moments">
                          {shown.map(m => { const mr = resolved[m.id] || {}; return <li key={m.id}><span className="mt">{mr.start != null ? fmtTime(mr.start) : "–"}</span><span>{m.name || "Untitled moment"}</span></li>; })}
                          {more > 0 ? <li className="more">{"+ " + more + " more"}</li> : null}
                        </ul>
                      ) : null}
                      {!viewer && w.length ? <div className="flag">{"▲ " + w[0]}{w.length > 1 ? " (+" + (w.length - 1) + " more)" : ""}</div> : null}
                    </button>
                  </div>
                </div>
              );
            })}
          </section>
        );
      })}
    </div>
  );
}

/* ================= Summary rail ================= */
function SummaryRail({ viewer, needList, warnList, counts, total, glance, onSelect }) {
  const pc = n => (total ? (n / total * 100) : 0) + "%";
  const glanceCard = (
    <div className="rcard glance-card"><h3>The day</h3>
      <dl className="glance">
        <dt>Begins</dt><dd>{glance.first ? glance.first : "not set"}</dd>
        <dt>Ends</dt><dd>{glance.last ? glance.last : "not set"}</dd>
        <dt>Length</dt><dd>{glance.span}</dd>
      </dl>
    </div>
  );
  if (viewer) {
    return (
      <React.Fragment>
        {glanceCard}
        <div className="rcard"><h3>Good to know</h3><p className="fine" style={{ margin: 0 }}>Times marked <b>To be confirmed</b> may still shift a little. Nicole and Michael will keep this page up to date.</p></div>
      </React.Fragment>
    );
  }
  return (
    <React.Fragment>
      <div className="rcard"><h3>Still to book <span className="count">{needList.length}</span></h3>
        {needList.length ? (
          <ul className="rlist">{needList.map(n => (
            <li key={n.id}><button type="button" className="rbtn" onClick={() => onSelect(n.id)}><span className="rt">{n.title}<span className="rs">{n.sub}</span></span>{ICONS.chev}</button></li>
          ))}</ul>
        ) : <p className="fine" style={{ margin: 0 }}>Everything is booked. Lovely.</p>}
      </div>
      {warnList.length ? (
        <div className="rcard rcard-warn"><h3>Worth a look <span className="count warn">{warnList.length}</span></h3>
          <ul className="rlist">{warnList.map(n => (
            <li key={n.id}><button type="button" className="rbtn" onClick={() => onSelect(n.id)}><span className="rt warn-li"><b>{n.title}</b><br />{n.msg}</span>{ICONS.chev}</button></li>
          ))}</ul>
        </div>
      ) : null}
      <div className="rcard"><h3>Planning progress</h3>
        <div className="fine"><b className="prog-n">{counts.confirmed}</b> of {total} details confirmed</div>
        <div className="bar" role="img" aria-label={counts.confirmed + " confirmed, " + counts.provisional + " tentative, " + counts.unbooked + " still to book"}>
          <span style={{ width: pc(counts.confirmed), background: "var(--steel)" }}></span>
          <span style={{ width: pc(counts.provisional), background: "var(--light-blue)" }}></span>
          <span style={{ width: pc(counts.unbooked), background: "var(--lime)" }}></span>
        </div>
        <div className="key"><span><i className="kdot k-c"></i>{counts.confirmed} confirmed</span><span><i className="kdot k-t"></i>{counts.provisional} tentative</span><span><i className="kdot k-u"></i>{counts.unbooked} to book</span></div>
      </div>
      {glanceCard}
    </React.Fragment>
  );
}

/* ================= Detail panel: drawer on desktop, bottom sheet on phones ================= */
const ST_OPTIONS = [["confirmed", "Confirmed"], ["provisional", "Tentative"], ["unbooked", "Still to book"]];
function StatusSeg({ value, onChange }) {
  return (
    <div className="stseg" role="group" aria-label="Status">
      {ST_OPTIONS.map(([v, label]) => (
        <button key={v} type="button" className={v === "unbooked" ? "u" : ""} aria-pressed={value === v} onClick={() => onChange(v)}>{label}</button>
      ))}
    </div>
  );
}
function PartyChips({ options, selected, onToggle }) {
  return (
    <div className="pchips">
      {options.map(p => { const on = (selected || []).includes(p.id); return (
        <button key={p.id} type="button" className={"pchip" + (on ? " on" : "")} aria-pressed={on} style={on ? { background: p.color } : {}} onClick={() => onToggle(p.id)}>
          <span className="dot" style={{ background: on ? "#fff" : p.color }}></span>{p.name}
        </button>); })}
    </div>
  );
}
function Psec({ title, className, note, children }) {
  return <section className={"psec" + (className ? " " + className : "")}>{title ? <h4>{title}</h4> : null}{note ? <p className="lockline">{note}</p> : null}{children}</section>;
}
function PanelShell({ badge, title, sub, onClose, footer, label, children }) {
  const closeRef = useRef(null);
  useEffect(() => {
    const prev = document.activeElement; const prevOverflow = document.body.style.overflow;
    if (closeRef.current) closeRef.current.focus({ preventScroll: true });
    document.body.style.overflow = "hidden";
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prevOverflow; if (prev && prev.focus) prev.focus({ preventScroll: true }); };
  }, []);
  /* Only the fullscreen element is visible in fullscreen, so render inside the expanded map when it is open. */
  const host = document.querySelector(".map-shell.expanded") || document.body;
  const node = (
    <React.Fragment>
      <div className="dscrim" onClick={onClose}></div>
      <aside className="dpanel" role="dialog" aria-modal="true" aria-label={label}>
        <div className="grab"></div>
        <div className="panel-head">
          <div>{badge}<h2>{title}</h2><p className="panel-sub">{sub}</p></div>
          <button type="button" className="x" ref={closeRef} onClick={onClose} aria-label="Close details">{ICONS.x}</button>
        </div>
        <div className="panel-body">{children}</div>
        <div className="panel-foot">{footer}</div>
      </aside>
    </React.Fragment>
  );
  return host === document.body ? node : ReactDOM.createPortal(node, host);
}

function DetailPanel({ kind, row, events, subEvents, parties, places, resolved, warnings, editable, onUpdate, onDuplicate, onDelete, onClose, onAddSubEvent, onSelect, onUpdatePlace, onUpdateParty }) {
  if (!row) return null;
  const r = resolved[row.id] || {};
  const isEvent = kind === "event";
  const host = isEvent ? null : (events.find(s => s.id === row.event) || null);
  const hostRes = host ? (resolved[host.id] || {}) : {};
  const title = isEvent ? cardTitle(row, places) : (row.name || "Untitled moment");
  const range = r.start != null ? fmtTime(r.start) + (r.end != null && row.duration > 0 ? " – " + fmtTime(r.end) : "") + (row.duration > 0 ? " · " + fmtDur(row.duration) : "") : "Time not set yet";
  const badge = <span className={"badge s-" + row.status}>{statusText(row.status, !editable)}</span>;
  const placeOf = isEvent ? row : host;
  const locPlace = placeOf && placeOf.location ? places.find(p => p.id === placeOf.location) : null;
  const kids = isEvent ? subEvents.filter(m => m.event === row.id).slice().sort((a, b) => { const ra = resolved[a.id] || {}, rb = resolved[b.id] || {}; return (ra.start == null ? 1e9 : ra.start) - (rb.start == null ? 1e9 : rb.start); }) : [];
  const partyOptions = isEvent ? parties : (host ? parties.filter(p => (host.parties || []).includes(p.id)) : parties);
  const toggleParty = pid => { const has = (row.parties || []).includes(pid); onUpdate({ parties: has ? row.parties.filter(p => p !== pid) : [...(row.parties || []), pid] }); };
  const partyObjs = (row.parties || []).map(pid => parties.find(p => p.id === pid)).filter(Boolean);
  const fromEv = isEvent && row.type === "travel" && row.follows ? events.find(s => s.id === row.follows) : null;
  const fromPlace = fromEv && fromEv.location ? places.find(p => p.id === fromEv.location) : null;

  const callTargets = isEvent ? partyCallTargets(events, parties, resolved) : {};
  const callRows = partyObjs.map(p => ({ p, t: callTimeFor(row, p.id, parties, callTargets) })).filter(c => c.t != null && r.start != null && c.t < r.start);

  /* ---------- read-only view for guests and the bridal party ---------- */
  if (!editable) {
    return (
      <PanelShell badge={badge} title={title} sub={range} onClose={onClose} label={title + " details"}
        footer={<React.Fragment><span className="spacer"></span><button type="button" className="btn" onClick={onClose}>Close</button></React.Fragment>}>
        {locPlace || fromPlace ? (
          <Psec title="Where">
            <p className="rowline">{ICONS.pin}<span>{fromPlace && locPlace ? fromPlace.name + " to " + locPlace.name : locPlace.name}</span></p>
            {locPlace && locPlace.address ? <p className="fine" style={{ margin: 0 }}>{locPlace.address}</p> : null}
          </Psec>
        ) : null}
        {!isEvent && host ? <Psec title="During"><button type="button" className="link-btn" onClick={() => onSelect(host.id)}>{cardTitle(host, places)}</button></Psec> : null}
        {partyObjs.length ? <Psec title="Who"><ul className="plist">{partyObjs.map(p => <li key={p.id}><i className="pdot" style={{ background: p.color }}></i>{p.name}</li>)}</ul></Psec> : null}
        {isEvent && row.type === "event" && r.start != null && callRows.length ? (
          <Psec title="Call times"><ul className="mlist">{callRows.map(c => <li key={c.p.id}><span className="mt">{fmtTime(c.t)}</span><span className="mn">{c.p.name}</span></li>)}</ul></Psec>
        ) : null}
        {kids.length ? (
          <Psec title="Moments"><ul className="mlist">{kids.map(c => { const cr = resolved[c.id] || {}; return <li key={c.id}><span className="mt">{cr.start != null ? fmtTime(cr.start) : "–"}</span><span className="mn">{c.name || "Untitled moment"}</span></li>; })}</ul></Psec>
        ) : null}
        {row.publicNotes ? <Psec title="Notes"><p style={{ margin: 0, whiteSpace: "pre-wrap" }}>{row.publicNotes}</p></Psec> : null}
        {row.status !== "confirmed" ? <Psec><p className="fine" style={{ margin: 0 }}>This time is still to be confirmed and may shift a little.</p></Psec> : null}
      </PanelShell>
    );
  }

  const footer = (
    <React.Fragment>
      <button type="button" className="btn" onClick={onDuplicate}>Duplicate</button>
      <button type="button" className="btn danger-btn" onClick={onDelete}>Delete</button>
      <span className="spacer"></span>
      <button type="button" className="btn primary" onClick={onClose}>Done</button>
    </React.Fragment>
  );
  const warnBlock = warnings && warnings.length > 0
    ? <div className="insp-warn"><h4>Worth a look</h4><ul>{warnings.map((w, i) => <li key={i}>{w}</li>)}</ul></div>
    : null;

  /* ---------- private planning details, editors only ---------- */
  const privateBlock = (
    <Psec className="private" title={<React.Fragment>{ICONS.lock}Only you two can see this</React.Fragment>} note="Hidden from guests and the bridal party.">
      <label className="fld"><span>Private notes</span>
        <textarea className="cell-input bx insp-notes" value={row.notes} placeholder="Reminders, to-dos, anything just for you" onChange={e => onUpdate({ notes: e.target.value })} />
      </label>
      <label className="fld"><span>Who is handling this</span>
        <input className="cell-input bx" value={row.owner || ""} placeholder="Nicole, Michael, or a helper" onChange={e => onUpdate({ owner: e.target.value })} />
      </label>
      <VendorBlock row={row} onUpdate={onUpdate} />
      <CallTimes row={row} parties={parties} onUpdate={onUpdate} />
      {locPlace ? (
        <div className="fld"><span>Site contact at {locPlace.name}</span>
          <input className="cell-input bx" placeholder="Name and phone" value={locPlace.contact || ""} onChange={e => onUpdatePlace(locPlace.id, { contact: e.target.value })} />
        </div>
      ) : null}
      <details className="party-defaults">
        <summary>Default call time for each group</summary>
        <div className="pd-list">
          {parties.map(p => (
            <div className="ct-row" key={p.id}>
              <span className="ct-name"><span className="ct-dot" style={{ background: p.color }}></span>{p.name}</span>
              <input className="cell-input bx time" style={{ width: "104px" }} key={p.id + "_" + (p.callTime == null ? "n" : p.callTime)} defaultValue={p.callTime == null ? "" : fmtTime(p.callTime)} placeholder="default"
                onBlur={e => { const v = parseTime(e.target.value); if (v === undefined) { e.target.value = p.callTime == null ? "" : fmtTime(p.callTime); return; } onUpdateParty(p.id, { callTime: v }); }}
                onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
            </div>
          ))}
        </div>
      </details>
    </Psec>
  );
  const publicNotes = (
    <Psec title="Notes everyone can see">
      <div className="fld"><textarea className="cell-input bx insp-notes" value={row.publicNotes || ""} placeholder="Anything guests or the bridal party should know" onChange={e => onUpdate({ publicNotes: e.target.value })} /></div>
    </Psec>
  );

  /* ---------- editor: event ---------- */
  if (isEvent) {
    return (
      <PanelShell badge={badge} title={title} sub={range} onClose={onClose} footer={footer} label={title + " details"}>
        <Psec title="Status"><StatusSeg value={row.status} onChange={v => onUpdate({ status: v })} /></Psec>
        {warnBlock ? <Psec>{warnBlock}</Psec> : null}
        <Psec title="When">
          <label className="fld"><span>Name</span>
            <input className="cell-input bx" value={row.label} placeholder={eventName({ ...row, label: "" }, places)} onChange={e => onUpdate({ label: e.target.value })} />
          </label>
          <div className="fld2">
            <label className="fld"><span>Kind</span>
              <select className="cell-select bx" value={row.type} onChange={e => onUpdate({ type: e.target.value })}>
                <option value="event">Event</option><option value="travel">Travel</option>
              </select>
            </label>
            <label className="fld"><span>How long (min)</span>
              <input className="cell-input bx dur" type="number" min="0" value={row.duration == null ? "" : row.duration}
                onChange={e => { const v = e.target.value; onUpdate({ duration: v === "" ? 0 : Math.max(0, parseInt(v, 10) || 0) }); }} />
            </label>
          </div>
          <div className="fld2">
            <label className="fld"><span>Start time</span>
              <input className="cell-input bx time" key={row.id + "_" + (row.start == null ? "n" : row.start)} defaultValue={fmtTime(row.start)} placeholder={row.follows ? "automatic" : "9:00 am"}
                onBlur={e => { const v = parseTime(e.target.value); if (v === undefined) { e.target.value = fmtTime(row.start); return; } onUpdate({ start: v }); }}
                onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
            </label>
            <div className="fld"><span>Ends</span><div className="insp-end">{r.end == null ? "not set" : fmtTime(r.end)}</div></div>
          </div>
          <div className="fld"><span>Starts right after</span>
            <div className="after-row">
              <select className="cell-select bx" value={row.follows || ""} onChange={e => onUpdate({ follows: e.target.value || null })}>
                <option value="">Nothing, use the start time</option>
                {events.filter(o => o.id !== row.id).map(o => <option key={o.id} value={o.id}>{cardTitle(o, places) + (((resolved[o.id] || {}).start != null) ? ", " + fmtTime((resolved[o.id] || {}).start) : "")}</option>)}
              </select>
              {row.follows ? (
                <span className="after-gap"><span className="plus">+</span>
                  <input className="cell-input bx" type="number" style={{ width: "66px" }} value={row.gap == null ? "" : row.gap} placeholder="0"
                    onChange={e => { const v = e.target.value; onUpdate({ gap: v === "" ? null : parseInt(v, 10) || 0 }); }} />
                  <span className="mins">min later</span></span>
              ) : null}
            </div>
          </div>
          <p className="ct-hint">A start time you type holds that exact time. Clear it and this event starts right after the one above.</p>
          <label className="fld"><span>Buffer after (min)</span>
            <input className="cell-input bx" type="number" min="0" value={row.buffer == null ? "" : row.buffer} placeholder="extra padding" onChange={e => { const v = e.target.value; onUpdate({ buffer: v === "" ? null : Math.max(0, parseInt(v, 10) || 0) }); }} />
          </label>
        </Psec>
        <Psec title="Where">
          <label className="fld"><span>{row.type === "travel" ? "Going to" : "Place"}</span>
            <select className="cell-select bx" value={row.location || ""} onChange={e => onUpdate({ location: e.target.value || null })}>
              <option value="">(none)</option>
              {places.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </label>
          {locPlace ? (
            <label className="fld"><span>Address</span>
              <input className="cell-input bx" placeholder="Street address" value={locPlace.address || ""} onChange={e => onUpdatePlace(locPlace.id, { address: e.target.value })} />
            </label>
          ) : null}
        </Psec>
        <Psec title="Who is here"><PartyChips options={parties} selected={row.parties} onToggle={toggleParty} />
          {!parties.length ? <p className="ct-hint">No groups yet. Add some under Groups and places.</p> : null}
        </Psec>
        {row.type !== "travel" ? (
          <Psec title={"Moments" + (kids.length ? " (" + kids.length + ")" : "")}>
            {kids.length ? (
              <ul className="sub-list" style={{ marginBottom: 10 }}>
                {kids.map(c => { const cr = resolved[c.id] || {}; return (
                  <li key={c.id}>
                    <button type="button" className="sub-item" onClick={() => onSelect(c.id)}>
                      <span className="sub-time">{cr.start != null ? fmtTime(cr.start) : "–"}</span>
                      <span className="sub-name">{c.name || "Untitled moment"}</span>
                      <span className={"sub-kind " + (c.pinned ? "phase" : "moment")}>{c.pinned ? "fixed time" : "follows event"}</span>
                    </button>
                  </li>); })}
              </ul>
            ) : <p className="sub-empty" style={{ marginBottom: 10 }}>Moments are the little times inside an event, like the first dance or when hair is done.</p>}
            <button type="button" className="btn" onClick={() => onAddSubEvent(row.id, null)}>{ICONS.plus}Add a moment</button>
          </Psec>
        ) : null}
        {publicNotes}
        {privateBlock}
      </PanelShell>
    );
  }

  /* ---------- editor: moment (sub event) ---------- */
  const setStartFromInput = v => { if (row.pinned) onUpdate({ start: v }); else if (hostRes.start != null && v != null) onUpdate({ offset: v - hostRes.start }); };
  return (
    <PanelShell badge={badge} title={title} sub={range} onClose={onClose} footer={footer} label={title + " details"}>
      <Psec title="Status"><StatusSeg value={row.status} onChange={v => onUpdate({ status: v })} /></Psec>
      {warnBlock ? <Psec>{warnBlock}</Psec> : null}
      <Psec title="What and when">
        <label className="fld"><span>What happens</span>
          <input className="cell-input bx" value={row.name} placeholder="Bride hair done, dinner served" onChange={e => onUpdate({ name: e.target.value })} />
        </label>
        <label className="fld"><span>During this event</span>
          <select className="cell-select bx" value={row.event || ""} onChange={e => onUpdate({ event: e.target.value || null })}>
            <option value="">(none)</option>
            {events.map(s => <option key={s.id} value={s.id}>{cardTitle(s, places) + (((resolved[s.id] || {}).start != null) ? ", " + fmtTime((resolved[s.id] || {}).start) : "")}</option>)}
          </select>
        </label>
        {host ? <p className="ct-hint" style={{ marginTop: -6 }}><button type="button" className="link-btn" onClick={() => onSelect(host.id)}>Open {cardTitle(host, places)}</button></p> : null}
        <div className="fld"><span>Time</span>
          <select className="cell-select bx" value={row.pinned ? "pinned" : "float"}
            onChange={e => { const pin = e.target.value === "pinned";
              if (pin) onUpdate({ pinned: true, start: r.start != null ? r.start : (hostRes.start != null ? hostRes.start + (row.offset || 0) : null) });
              else onUpdate({ pinned: false, offset: (r.start != null && hostRes.start != null) ? r.start - hostRes.start : 0, start: null }); }}>
            <option value="float">Follows the event if it moves</option>
            <option value="pinned">Fixed clock time</option>
          </select>
          <p className="ct-hint">{row.pinned ? "Stays at this clock time no matter what." : "Keeps its distance from the start of the event, currently " + (row.offset || 0) + " min in."}</p>
        </div>
        <div className="fld2">
          <label className="fld"><span>Start time</span>
            <input className="cell-input bx time" key={row.id + "_" + (r.start == null ? "n" : r.start)} defaultValue={fmtTime(r.start)} placeholder="9:00 am"
              onBlur={e => { const v = parseTime(e.target.value); if (v === undefined || v === null) { e.target.value = fmtTime(r.start); return; } setStartFromInput(v); }}
              onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
          </label>
          <label className="fld"><span>How long (min)</span>
            <input className="cell-input bx dur" type="number" min="0" value={row.duration == null ? "" : row.duration}
              onChange={e => { const v = e.target.value; onUpdate({ duration: v === "" ? 0 : Math.max(0, parseInt(v, 10) || 0) }); }} />
          </label>
        </div>
        <div className="fld"><span>Ends</span><div className="insp-end">{row.duration > 0 ? (r.end == null ? "not set" : fmtTime(r.end)) : "a single moment in time"}</div></div>
      </Psec>
      <Psec title="Who"><PartyChips options={partyOptions} selected={row.parties} onToggle={toggleParty} /></Psec>
      {publicNotes}
      {privateBlock}
    </PanelShell>
  );
}

function App() {
  /* ----- auth + cloud state ----- */
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(LOCAL_MODE);
  const [loading, setLoading] = useState(!LOCAL_MODE);
  const [docExists, setDocExists] = useState(LOCAL_MODE ? true : null);
  const [saveStatus, setSaveStatus] = useState("idle");
  const isEditor = LOCAL_MODE ? true : emailAllowed(user && user.email);
  const editable = isEditor;

  const seeded = useMemo(() => normalizeState(seedState()), []);
  const [events, setEvents] = useState(LOCAL_MODE ? seeded.events : []);
  const [subEvents, setSubEvents] = useState(LOCAL_MODE ? seeded.subEvents : []);
  const [parties, setParties] = useState(LOCAL_MODE ? seeded.parties : []);
  const [places, setPlaces] = useState(LOCAL_MODE ? seeded.places : []);
  const [selId, setSelId] = useState(null);

        <div className="ov-stats">
          <div className="ov-stat"><span className="ov-k">First</span><span className="ov-v">{firstRow ? rowName(firstRow) + ", " + fmtTime(resolved[firstRow.id].start) : "nothing scheduled"}</span></div>
          <div className="ov-stat"><span className="ov-k">Last</span><span className="ov-v">{lastRow ? rowName(lastRow) + ", " + fmtTime(resolved[lastRow.id].end) : "nothing scheduled"}</span></div>
          <div className="ov-stat"><span className="ov-k">Span</span><span className="ov-v mono">{spanFmt}</span></div>
          <div className="ov-stat"><span className="ov-k">Places</span><span className="ov-v mono">{places.length}</span></div>
        </div>
        <div className="ov-roll">
          <div className="roll-bar" role="img" aria-label={"Statuses: " + statusCounts.confirmed + " confirmed, " + statusCounts.provisional + " tentative, " + statusCounts.unbooked + " still to book"}>
            {statusCounts.confirmed > 0 ? <span className="seg-confirmed" style={{ width: pct(statusCounts.confirmed) + "%" }}></span> : null}
            {statusCounts.provisional > 0 ? <span className="seg-provisional" style={{ width: pct(statusCounts.provisional) + "%" }}></span> : null}
            {statusCounts.unbooked > 0 ? <span className="seg-unbooked" style={{ width: pct(statusCounts.unbooked) + "%" }}></span> : null}
          </div>
          <div className="roll-key">
            <span className="rk"><span className="rk-dot c"></span>{statusCounts.confirmed} confirmed</span>
            <span className="rk"><span className="rk-dot p"></span>{statusCounts.provisional} tentative</span>
            <span className="rk"><span className="rk-dot u"></span>{statusCounts.unbooked} still to book</span>
          </div>
        </div>
      </section>
      ) : null}

      <div className="toolbar">
        <div className="tabs" role="group" aria-label="Choose a view">
          <button type="button" className={"seg-btn" + (view === "timeline" ? " on" : "")} aria-pressed={view === "timeline"} onClick={() => setView("timeline")}>{ICONS.list}<span>Timeline</span></button>
          <button type="button" className={"seg-btn" + (view === "map" ? " on" : "")} aria-pressed={view === "map"} onClick={() => setView("map")}>{ICONS.map}<span>Map</span></button>
          <button type="button" className={"seg-btn" + (view === "table" ? " on" : "")} aria-pressed={view === "table"} onClick={() => setView("table")}>{ICONS.table}<span>Table</span></button>
        </div>
        <span className="spacer"></span>
        <div className="tb-actions">
          {editable ? (
            <React.Fragment>
              <button className="btn subtle" onClick={undo} disabled={!canUndo} title="Undo (Ctrl or Cmd + Z)">Undo</button>
              <button className="btn subtle" onClick={redo} disabled={!canRedo} title="Redo (Ctrl or Cmd + Shift + Z)">Redo</button>
            </React.Fragment>
          ) : null}
          {view === "timeline" ? <button className="btn subtle print-btn" onClick={() => window.print()}>{ICONS.print}Print the schedule</button> : null}
          {editable ? <button className="btn" onClick={() => setShowManager(v => !v)}>{showManager ? "Hide groups and places" : "Groups and places"}</button> : null}
          {editable && view !== "map" ? <button className="btn primary add-btn" onClick={() => addEvent({})} aria-label="Add event">{ICONS.plus}<span>Add event</span></button> : null}
        </div>
      </div>

      {view === "map" || view === "table" ? (
        <div className="viewopts">
          <div className="seg">
            <button className={"seg-btn" + (filter === "all" ? " on" : "")} onClick={() => setFilter("all")}>Everything</button>
            <button className={"seg-btn" + (filter === "unconfirmed" ? " on" : "")} onClick={() => setFilter("unconfirmed")}>Still to confirm</button>
          </div>
          {view === "map" ? (
            <React.Fragment>
              <label className="chk"><input type="checkbox" checked={showLabels} onChange={e => setShowLabels(e.target.checked)} /> Show labels</label>
              <label className="chk"><input type="checkbox" checked={collapseTrunk} onChange={e => setCollapseTrunk(e.target.checked)} /> Collapse where all together</label>
            </React.Fragment>
          ) : null}
        </div>
      ) : null}

      {editable && showManager ? (
        <div className="manager">
          <div className="mgr-card">
            <div className="mgr-head"><h3>Groups</h3><button className="btn" onClick={addParty}>Add group</button></div>
            <div className="party-list">
              {parties.slice().sort((a, b) => a.laneOrder - b.laneOrder).map((p, idx, arr) => (
                <div className="party-row" key={p.id}>
                  <input type="color" className="color-input" value={p.color} title="Line color" onChange={e => updateParty(p.id, { color: e.target.value })} />
                  <input className="cell-input mgr-name" value={p.name} onChange={e => updateParty(p.id, { name: e.target.value })} />
                  <span className="lane-label">track {p.laneOrder + 1}</span>
                  <button className="icon-btn" title="Move earlier track" disabled={idx === 0} onClick={() => moveParty(p.id, -1)}>{"↑"}</button>
                  <button className="icon-btn" title="Move later track" disabled={idx === arr.length - 1} onClick={() => moveParty(p.id, 1)}>{"↓"}</button>
                  <button className="icon-btn danger" title="Remove group" onClick={() => requestRemoveParty(p.id)}>{"✕"}</button>
                </div>
              ))}
              {parties.length === 0 ? <p className="mgr-note">No groups yet. Add one to put it on an event.</p> : null}
            </div>
            <p className="mgr-note">Track order sets where each group's line sits when several groups share a place in the map. Removing a group takes it off every event and moment it was on.</p>
          </div>
          <div className="mgr-card">
            <div className="mgr-head"><h3>Places</h3><button className="btn" onClick={addPlace}>Add place</button></div>
            <div className="place-list">
              {places.map((p, idx) => (
                <div className="place-row" key={p.id}>
                  <span className="lane-label">col {idx + 1}</span>
                  <input className="cell-input mgr-name" value={p.name} onChange={e => updatePlace(p.id, { name: e.target.value })} />
                  <button className="icon-btn" title="Move column left" disabled={idx === 0} onClick={() => movePlace(p.id, -1)}>{"↑"}</button>
                  <button className="icon-btn" title="Move column right" disabled={idx === places.length - 1} onClick={() => movePlace(p.id, 1)}>{"↓"}</button>
                  <button className="icon-btn danger" title="Remove place" onClick={() => requestRemovePlace(p.id)}>{"✕"}</button>
                </div>
              ))}
              {places.length === 0 ? <p className="mgr-note">No places yet. Add one to set it as an event's place.</p> : null}
            </div>
            {places.length > 0 ? (
              <React.Fragment>
                <h4 className="matrix-title">Drive times in minutes</h4>
                <div className="matrix-wrap">
                  <table className="matrix">
                    <thead><tr><th className="corner">from \ to</th>{places.map(p => <th key={p.id}>{p.name}</th>)}</tr></thead>
                    <tbody>
                      {places.map(from => (
                        <tr key={from.id}>
                          <th>{from.name}</th>
                          {places.map(to => (
                            <td key={to.id}>
                              {from.id === to.id ? <span className="diag">{"·"}</span> : (
                                <input className="cell-input mtx" type="number" min="0" value={from.drives && from.drives[to.id] != null ? from.drives[to.id] : ""} onChange={e => setDrive(from.id, to.id, e.target.value)} />
                              )}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </React.Fragment>
            ) : null}
            <p className="mgr-note">Places are the columns in the map, left to right in this order, so use the arrows to reorder them. Each drive cell is the time from the row place to the column place, and the travel warning uses these. Removing a place clears it from any event that used it.</p>
          </div>
        </div>
      ) : null}

      {view === "timeline" ? (
        <React.Fragment>
          {sortedParties.length ? (
            <div className="viewas">
              <p className="viewas-label">Show me the day for</p>
              <div className="chips" role="group" aria-label="Filter by group">
                <button type="button" className="fchip" aria-pressed={!viewAs} onClick={() => setViewAs(null)}>Everyone</button>
                {sortedParties.map(p => (
                  <button type="button" key={p.id} className="fchip" aria-pressed={viewAs === p.id} onClick={() => setViewAs(viewAs === p.id ? null : p.id)}><i className="pdot" style={{ background: p.color }}></i>{p.name}</button>
                ))}
              </div>
              {viewAsParty ? <p className="showing">Showing {shownEventCount} of {events.length} events for <b>{viewAsParty.name}</b> {"·"} <button type="button" onClick={() => setViewAs(null)}>Show everyone</button></p> : null}
            </div>
          ) : null}
          <button type="button" className="rail-toggle" aria-expanded={railOpen} onClick={() => setRailOpen(v => !v)}>
            {editable ? (
              <span className="rt-l"><span>Planning summary</span>{needList.length ? <span className="count">{needList.length} still to book</span> : null}{warnList.length ? <span className="count warn">{warnList.length} to check</span> : null}</span>
            ) : <span>The day at a glance</span>}
            {ICONS.chev}
          </button>
          <div className="layout">
            <aside className={"rail-col" + (railOpen ? " open" : "")} aria-label="Summary">
              <SummaryRail viewer={!editable} needList={needList} warnList={warnList} counts={statusCounts} total={rows.length} glance={glance} onSelect={setSelId} />
            </aside>
            <main className="tl">
              <div className="tl-legend">
                <span><i className="kdot k-c"></i>Confirmed</span>
                <span><i className="kdot k-t"></i>{editable ? "Tentative" : "To be confirmed"}</span>
                {editable ? <span><i className="kdot k-u"></i>Still to book</span> : null}
              </div>
              <TimelineView events={events} subEvents={subEvents} parties={parties} places={places} resolved={resolved} warningsById={warningsById}
                selId={selId} onSelect={setSelId} viewer={!editable} viewAs={viewAs} onAddEvent={addEvent} />
            </main>
          </div>
        </React.Fragment>
      ) : view === "map" ? (
        <MapView events={events} subEvents={subEvents} parties={parties} places={places} resolved={resolved} selId={selId} setSelId={setSelId}
          collapse={collapseTrunk} showLabels={showLabels} onMovePlaceTo={movePlaceTo} onMoveEvent={moveEvent} onAddEvent={addEvent} onAddSubEvent={addSubEvent} filter={filter} editable={editable} onExpandedChange={setMapFs} />
      ) : (
      <fieldset className="edit-scope" disabled={!editable}>
      <div className="table-wrap">
        <table className="grid">
          <thead>
            <tr>
              <th>Type</th><th className="col-name">Name</th><th>Groups</th><th>Place</th><th>Starts</th><th>Start</th><th>Duration</th><th>End</th><th>Status</th>{editable ? (<React.Fragment><th>Handled by</th><th>Vendor</th><th>Private notes</th><th className="col-warn" title="Worth a look">!</th><th></th></React.Fragment>) : null}
            </tr>
          </thead>
          <tbody>
            {sections.map(section => {
              const visRows = section.rows.filter(({ row }) => rowMatches(row));
              if (!visRows.length) return null;
              return (
                <React.Fragment key={"sec-" + section.label}>
                  <tr className="section-row"><td colSpan={editable ? 14 : 9}>{section.label}</td></tr>
                  {visRows.map(item => {
                    const s = item.row; const r = resolved[s.id] || {}; const w = warningsById[s.id] || [];
                    const isMoment = item.kind === "subEvent"; const host = item.host || null; const hostRes = host ? (resolved[host.id] || {}) : {};
                    const partyOptions = isMoment && host ? parties.filter(p => (host.parties || []).includes(p.id)) : parties;
                    return (
                      <tr key={s.id} className={selId === s.id ? "sel" : ""} onClick={() => setSelId(s.id)}>
                        <td>
                          {isMoment ? (<span className="end-val" title={host ? "A moment during " + eventName(host, places) : "This moment has no event"}>moment</span>) : (
                            <select className="cell-select" value={s.type} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { type: e.target.value })}><option value="event">event</option><option value="travel">travel</option></select>)}
                        </td>
                        <td className="col-name">
                          <div className="ev-cell" style={item.depth > 0 ? { paddingLeft: "12px" } : null}>
                            {item.depth > 0 ? <span className="child-tick" title={host ? "On " + eventName(host, places) : ""}>{"↳"}</span> : null}
                            {isMoment ? (
                              <input className="cell-input" value={s.name} placeholder="what happens" onClick={e => e.stopPropagation()} onChange={e => updateSubEvent(s.id, { name: e.target.value })} />
                            ) : (
                              <input className="cell-input" value={s.label} placeholder={eventName({ ...s, label: "" }, places)} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { label: e.target.value })} />
                            )}
                          </div>
                        </td>
                        <td className="col-parties">
                          <div className="parties-cell">
                            {partyOptions.map(p => { const on = (s.parties || []).includes(p.id); return (
                              <span key={p.id} className={"pchip" + (on ? " on" : "")} style={on ? { background: p.color } : {}}
                                onClick={ev => { if (!editable) return; ev.stopPropagation(); isMoment ? toggleSubEventParty(s.id, p.id) : toggleEventParty(s.id, p.id); }} title={p.name}>
                                <span className="dot" style={{ background: on ? "#fff" : p.color }}></span>{p.name}
                              </span>); })}
                          </div>
                        </td>
                        <td>
                          {isMoment ? (<span className="end-val" title="From the event it sits on">{host ? (placeLabel(host.location) || "(none)") : "(no event)"}</span>) : (
                            <select className="cell-select" value={s.location || ""} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { location: e.target.value || null })}><option value="">(none)</option>{places.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>)}
                        </td>
                        <td>
                          {isMoment ? (
                            <select className="cell-select" value={s.pinned ? "pinned" : "float"} onClick={e => e.stopPropagation()}
                              onChange={e => { const pin = e.target.value === "pinned"; if (pin) updateSubEvent(s.id, { pinned: true, start: r.start != null ? r.start : null }); else updateSubEvent(s.id, { pinned: false, start: null, offset: (r.start != null && hostRes.start != null) ? r.start - hostRes.start : 0 }); }}>
                              <option value="float">follows the event</option><option value="pinned">fixed time</option>
                            </select>
                          ) : (
                            <div className="after-cell">
                              <select className="cell-select" value={s.follows || ""} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { follows: e.target.value || null })}><option value="">(none)</option>{events.filter(o => o.id !== s.id).map(o => <option key={o.id} value={o.id}>{eventName(o, places)}</option>)}</select>
                              {s.follows ? (<span className="after-mini"><span className="plus">+</span><input className="cell-input dur" type="number" min="0" style={{ width: "48px" }} value={s.gap == null ? "" : s.gap} placeholder="0" onClick={e => e.stopPropagation()} onChange={e => { const v = e.target.value; updateEvent(s.id, { gap: v === "" ? null : parseInt(v, 10) || 0 }); }} /><span className="mins">m</span></span>) : null}
                            </div>
                          )}
                        </td>
                        <td className="col-start">
                          <div className="start-cell">
                            {isMoment ? (s.pinned ? <span className="pin-dot" title="Pinned time"></span> : <span className="auto-chip" title={"Follows the event, " + (s.offset || 0) + " min in"}>{"+" + (s.offset || 0) + "m"}</span>) : (s.start != null ? <span className="pin-dot" title="Pinned start time"></span> : (s.follows ? <span className="auto-chip" title="Starts after another event">auto</span> : null))}
                            <input
                              className={"cell-input time" + ((isMoment ? s.pinned : s.start != null) ? " pinned" : " inherited")}
                              defaultValue={isMoment ? fmtTime(r.start) : fmtTime(s.start)}
                              key={s.id + "_" + (isMoment ? (r.start == null ? "n" : r.start) : (s.start == null ? "n" : s.start))}
                              placeholder={isMoment ? "set time" : (s.start == null ? (r.start != null ? fmtTime(r.start) : "set time") : "9:00 am")}
                              title={isMoment ? (s.pinned ? "Fixed time. Switch to follows the event to let it ride along." : "Follows the event. Typing a time changes how far into the event it sits.") : (s.start != null ? "Pinned. Clear it to fall back to starts after." : "Computed from starts after. Type a time to pin it.")}
                              onClick={e => e.stopPropagation()}
                              onBlur={e => { const v = parseTime(e.target.value);
                                if (isMoment) { if (v === undefined || v === null) { e.target.value = fmtTime(r.start); return; } if (s.pinned) updateSubEvent(s.id, { start: v }); else if (hostRes.start != null) updateSubEvent(s.id, { offset: v - hostRes.start }); }
                                else { if (v === undefined) { e.target.value = fmtTime(s.start); return; } updateEvent(s.id, { start: v }); } }}
                              onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                            />
                          </div>
                        </td>
                        <td className="col-dur">
                          <input className="cell-input dur" type="number" min="0" style={{ width: "72px" }} value={s.duration == null ? "" : s.duration} onClick={e => e.stopPropagation()} onChange={e => { const v = e.target.value; const patch = { duration: v === "" ? 0 : Math.max(0, parseInt(v, 10) || 0) }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} />
                        </td>
                        <td className="col-end">
                          <span className={"end-field" + (r.end == null ? " unset" : "")} title="Computed end, start plus duration">{isMoment && s.duration === 0 ? "point" : (r.end == null ? "not set" : fmtTime(r.end))}</span>
                        </td>
                        <td>
                          <select className={"cell-select status-sel st-" + s.status} value={s.status} onClick={e => e.stopPropagation()} onChange={e => { const patch = { status: e.target.value }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }}><option value="confirmed">Confirmed</option><option value="provisional">{statusText("provisional", !editable)}</option><option value="unbooked">{statusText("unbooked", !editable)}</option></select>
                        </td>
                        {editable ? (<React.Fragment>
                        <td><input className="cell-input" style={{ minWidth: "110px" }} value={s.owner || ""} placeholder="handled by" onClick={e => e.stopPropagation()} onChange={e => { const patch = { owner: e.target.value }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} /></td>
                        <td><input className="cell-input" style={{ minWidth: "120px" }} value={(s.vendor && s.vendor.name) || ""} placeholder="vendor" onClick={e => e.stopPropagation()} onChange={e => { const patch = { vendor: { ...(s.vendor || { name: "", contact: "", phone: "", email: "" }), name: e.target.value } }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} /></td>
                        <td><input className="cell-input" style={{ minWidth: "140px" }} value={s.notes} placeholder="notes" onClick={e => e.stopPropagation()} onChange={e => { const patch = { notes: e.target.value }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} /></td>
                        </React.Fragment>) : null}
                        {editable ? (<React.Fragment>
                        <td className="col-warn">{w.length > 0 ? <span className="warnflag" title={w.join("\n")}>{"▲"}</span> : ""}</td>
                        <td>
                          {editable ? (
                            <div className="row-actions" onClick={e => e.stopPropagation()}>
                              {!isMoment ? <button className="icon-btn" title="Add a moment to this event" onClick={() => addSubEvent(s.id, null)}>{"+"}</button> : null}
                              <button className="icon-btn" title="Duplicate row" onClick={() => (isMoment ? duplicateSubEvent(s.id) : duplicateEvent(s.id))}>{"⧉"}</button>
                              <button className="icon-btn danger" title="Delete row" onClick={() => (isMoment ? deleteSubEvent(s.id) : requestDeleteEvent(s.id))}>{"✕"}</button>
                            </div>
                          ) : null}
                        </td>
                        </React.Fragment>) : null}
                      </tr>
                    );
                  })}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      </fieldset>
      )}

      {editable && allWarnings.length > 0 ? (
        <div className="warnings-panel"><h3>Warnings ({allWarnings.length})</h3><ul>{allWarnings.map((w, i) => (<li key={i}><b>{w.name}:</b> {w.msg}</li>))}</ul></div>
      ) : (editable ? <div className="no-warn">{"✓"} No validation warnings.</div> : null)}

      {editable ? (
        <div className="io">
          <div className="io-card">
            <h3>Saving</h3>
            <p>Your changes save to the cloud automatically and sync to every device. {saveText ? saveText.charAt(0).toUpperCase() + saveText.slice(1) + "." : ""} You do not need to do anything to keep your work. Use download backup now and then if you want a copy on your computer.</p>
            <div className="io-row">
              <button className="btn" onClick={downloadBackup}>Download backup (JSON)</button>
              <button className="btn" onClick={downloadCsv}>Export CSV</button>
              <span className="spacer"></span>
              <button className="btn subtle danger-btn" onClick={clearTimeline} title="Remove every event and moment to start fresh">Clear the whole timeline</button>
            </div>
          </div>
        </div>
      ) : null}

      <div className="foot">
        <b>How times work:</b> an event holds a clock time when it has a start time. Otherwise it starts when the event it follows ends, plus any gap. A moment either holds a clock time or follows its event, keeping its distance from the event's start, so it moves along with it. The end time is always the start plus how long it runs. Times are shown in 12 hour time.
      </div>

      <DetailPanel kind={selKind} row={selEvent || selSubEvent} events={events} subEvents={subEvents} parties={parties} places={places} resolved={resolved}
        warnings={selId ? warningsById[selId] : null} editable={editable && !mapFs}
        onUpdate={patch => (selKind === "event" ? updateEvent(selId, patch) : updateSubEvent(selId, patch))}
        onDuplicate={() => (selKind === "event" ? duplicateEvent(selId) : duplicateSubEvent(selId))}
        onDelete={() => (selKind === "event" ? requestDeleteEvent(selId) : deleteSubEvent(selId))}
        onClose={() => setSelId(null)} onAddSubEvent={addSubEvent} onSelect={id => setSelId(id)} onUpdatePlace={updatePlace} onUpdateParty={updateParty} />

      {confirm ? (
        <div className="modal-scrim" onClick={() => setConfirm(null)}>
          <div className="modal" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
            <h3>{confirm.title}</h3>
            <p className="modal-lead">This removes data from other rows:</p>
            <ul className="modal-lines">{confirm.lines.map((l, i) => <li key={i}>{l}</li>)}</ul>
            <div className="modal-actions">
              <button className="btn" onClick={() => setConfirm(null)}>Cancel</button>
              <button className="btn danger-btn solid" onClick={confirm.onConfirm}>{confirm.confirmLabel || "Delete"}</button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
</content>
