<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Day Lines</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{color-scheme:light}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
  img{max-width:100%}
  [hidden]:not([hidden=until-found i]){display:none!important}
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --surface-2: #eef1f6; --ink: #171c26; --muted: #5b6577; --faint: #8b95a7;
    --border: #dde2ec; --border-strong: #c3cad8; --accent: #2f6fed; --accent-soft: #e4edfd;
    --confirmed: #1f2a3d; --provisional: #7c88a0; --unbooked: #b45309;
    --warn-bg: #fff4e5; --warn-ink: #9a4a06; --warn-border: #f0c088; --danger: #b91c1c; --good: #0f766e;
    --font-ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131a; --surface: #191d27; --surface-2: #212734; --ink: #e7ebf3; --muted: #9aa4b6; --faint: #6b7488;
      --border: #2b323f; --border-strong: #3a4353; --accent: #6f9bff; --accent-soft: #1e2740;
      --confirmed: #d3dae8; --provisional: #8b96ac; --unbooked: #f0a862;
      --warn-bg: #2e2413; --warn-ink: #f0c088; --warn-border: #5a4526; --danger: #f2807a; --good: #4bb3a6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a; --surface: #191d27; --surface-2: #212734; --ink: #e7ebf3; --muted: #9aa4b6; --faint: #6b7488;
    --border: #2b323f; --border-strong: #3a4353; --accent: #6f9bff; --accent-soft: #1e2740;
    --confirmed: #d3dae8; --provisional: #8b96ac; --unbooked: #f0a862;
    --warn-bg: #2e2413; --warn-ink: #f0c088; --warn-border: #5a4526; --danger: #f2807a; --good: #4bb3a6;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); margin: 0; }
  #root { padding: 0; }
  .app { max-width: 1400px; margin: 0 auto; padding: 20px 16px 64px; }

  fieldset.edit-scope { border: 0; margin: 0; padding: 0; min-inline-size: 0; }
  .authbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mode-chip { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
  .mode-chip.view { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .mode-chip.edit { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .who { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
  .save-status { font-size: 12px; font-family: var(--font-mono); color: var(--muted); }
  .save-status.saved { color: var(--good); }
  .save-status.error { color: var(--danger); }
  .signin-screen { max-width: 480px; margin: 90px auto; text-align: center; padding: 0 16px; }
  .signin-screen h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -0.01em; }
  .signin-screen p { color: var(--muted); line-height: 1.6; margin: 0 0 22px; }
  .loading-screen { max-width: 480px; margin: 110px auto; text-align: center; color: var(--muted); font-size: 15px; }
  .banner { border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }

  header.topbar {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 2px solid var(--border-strong);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .brand .tag { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
  .counts { font-size: 12px; color: var(--muted); font-family: var(--font-mono); display: flex; gap: 14px; }
  .counts b { color: var(--ink); font-weight: 600; }

  .overview { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 12px 14px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .ov-stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .ov-stat { display: flex; flex-direction: column; gap: 2px; }
  .ov-k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  .ov-v { font-size: 13px; color: var(--ink); font-weight: 500; }
  .ov-v.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .ov-roll { display: flex; flex-direction: column; gap: 6px; min-width: 240px; flex: 1; max-width: 420px; }
  .roll-bar { display: flex; height: 12px; border-radius: 20px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
  .roll-bar span { display: block; height: 100%; }
  .seg-confirmed { background: var(--good); }
  .seg-provisional { background: var(--provisional); }
  .seg-unbooked { background: var(--unbooked); }
  .roll-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .rk { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .rk-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .rk-dot.c { background: var(--good); } .rk-dot.p { background: var(--provisional); } .rk-dot.u { background: var(--unbooked); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:disabled:hover { border-color: var(--border); }

  .modal-scrim { position: fixed; inset: 0; background: rgba(15,20,28,0.5); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,0.28); max-width: 440px; width: 100%; padding: 20px; }
  .modal h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .modal-lead { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .modal-lines { margin: 0 0 16px; padding-left: 18px; font-size: 13px; color: var(--ink); line-height: 1.5; }
  .modal-lines li { margin: 4px 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .danger-btn.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
  .danger-btn.solid:hover { filter: brightness(1.05); border-color: var(--danger); }

  .viewbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .seg-btn { font-family: var(--font-ui); font-size: 13px; font-weight: 500; padding: 7px 18px; border: none; background: var(--surface); color: var(--muted); cursor: pointer; }
  .seg-btn:not(.on):hover { color: var(--ink); }
  .seg-btn.on { background: var(--accent); color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .chk input { cursor: pointer; }

  .map-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .mc-group { display: inline-flex; align-items: center; gap: 6px; }
  .zoom-pct { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 40px; text-align: center; }
  .seg.sm .seg-btn { padding: 5px 11px; font-size: 12px; }
  .mc-focus { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .mc-focus .cell-select { border: 1px solid var(--border-strong); border-radius: 7px; padding: 5px 8px; background: var(--surface); }
  .party-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .pl-item { display: inline-flex; align-items: center; gap: 6px; }
  .pl-item.clickable { cursor: pointer; padding: 2px 8px; border-radius: 20px; border: 1px solid transparent; }
  .pl-item.clickable:hover { border-color: var(--border-strong); }
  .pl-item.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .pl-item.dim { opacity: 0.4; }
  .pl-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .col-header { cursor: grab; }
  .col-header:active { cursor: grabbing; }
  .map-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); max-height: 74vh; }
  .mapsvg { display: block; }
  .mapsvg text { font-family: var(--font-ui); }
  .mapsvg text.tlabel { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .map-hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
  .col-band { cursor: crosshair; }
  .col-band:hover { opacity: 0.7 !important; }
  .map-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend .li { display: inline-flex; align-items: center; gap: 7px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  button.btn { font-family: var(--font-ui); font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.2; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.btn.primary:hover { filter: brightness(1.05); }
  button.btn.subtle { background: transparent; border-color: var(--border); color: var(--muted); }
  button.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .spacer { flex: 1; }

  .manager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
  @media (max-width: 860px) { .manager { grid-template-columns: 1fr; } }
  .mgr-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 14px; }
  .mgr-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .mgr-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .party-list, .place-list { display: flex; flex-direction: column; gap: 6px; }
  .party-row, .place-row { display: flex; align-items: center; gap: 8px; }
  .color-input { width: 32px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; flex: none; }
  .mgr-name { flex: 1; border: 1px solid var(--border) !important; }
  .lane-label { font-size: 11px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:hover { border-color: var(--border); color: var(--muted); }
  .mgr-note { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .matrix-title { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .matrix-wrap { overflow-x: auto; }
  table.matrix { border-collapse: collapse; font-size: 12px; }
  table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 3px 6px; text-align: center; white-space: nowrap; }
  table.matrix th { background: var(--surface-2); font-weight: 600; color: var(--muted); font-size: 11px; }
  table.matrix th.corner { font-weight: 500; font-family: var(--font-mono); }
  .cell-input.mtx { width: 58px; text-align: center; font-family: var(--font-mono); border: 1px solid var(--border) !important; }
  .diag { color: var(--faint); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table.grid { border-collapse: collapse; width: 100%; min-width: 1180px; font-size: 13px; table-layout: auto; }
  table.grid th { text-align: left; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
  table.grid td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid tr.sel td { background: var(--accent-soft); }

  .cell-input, .cell-select { width: 100%; font-family: var(--font-ui); font-size: 13px; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 4px 6px; }
  .cell-input:hover, .cell-select:hover { border-color: var(--border); }
  .cell-input:focus, .cell-select:focus { border-color: var(--accent); background: var(--surface); }
  .cell-input:disabled, .cell-select:disabled { opacity: 1; color: var(--ink); }
  .cell-input.time, .cell-input.dur, .cell-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  td.col-start, td.col-dur, td.col-end { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .end-val { padding: 4px 6px; color: var(--muted); }
  .end-val.unset { color: var(--faint); }

  tr.section-row td { background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 7px 10px; border-bottom: 1px solid var(--border-strong); position: sticky; }
  .start-cell { display: flex; align-items: center; gap: 5px; }
  .pin-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .auto-chip { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 5px; flex: none; }
  .cell-input.time.pinned { color: var(--ink); font-weight: 600; }
  .cell-input.time.inherited { color: var(--muted); }
  .cell-input.time.inherited::placeholder { color: var(--muted); opacity: 1; }
  .end-field { display: inline-block; min-width: 74px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  .end-field.unset { color: var(--faint); font-weight: 400; }

  .type-pill { display: inline-block; font-size: 11px; font-family: var(--font-mono); }
  select.cell-select { cursor: pointer; }

  .parties-cell { display: flex; flex-wrap: wrap; gap: 4px; min-width: 150px; }
  .pchip { font-size: 11px; padding: 2px 7px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--muted); white-space: nowrap; line-height: 1.4; display: inline-flex; align-items: center; gap: 5px; }
  .pchip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pchip.on { color: #fff; border-color: transparent; font-weight: 500; }
  .pchip.on .dot { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.55); }
  fieldset.edit-scope:disabled .pchip { cursor: default; }

  .status-sel { border-radius: 20px; padding: 2px 8px; font-size: 11.5px; font-weight: 500; border: 1px solid var(--border-strong); }
  .st-confirmed { color: var(--good); } .st-provisional { color: var(--muted); } .st-unbooked { color: var(--unbooked); }

  td.col-warn { width: 30px; text-align: center; }
  .warnflag { color: var(--warn-ink); cursor: default; font-family: var(--font-mono); font-size: 13px; }
  .row-actions { display: flex; gap: 4px; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .warnings-panel { margin-top: 14px; border: 1px solid var(--warn-border); background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .warnings-panel h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warn-ink); }
  .warnings-panel ul { margin: 0; padding-left: 18px; color: var(--warn-ink); }
  .warnings-panel li { margin: 3px 0; line-height: 1.45; }
  .warnings-panel li b { font-weight: 600; }
  .no-warn { color: var(--good); font-size: 13px; margin-top: 12px; display: flex; align-items: center; gap: 7px; }

  .io { margin-top: 26px; display: grid; grid-template-columns: 1fr; gap: 16px; }
  .io-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 14px; }
  .io-card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .io-card p { margin: 0 0 10px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .io-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .foot { margin-top: 30px; font-size: 12px; color: var(--faint); line-height: 1.6; }
  .foot b { color: var(--muted); font-weight: 600; }

  .app.with-inspector { padding-right: 356px; }
  @media (max-width: 900px) { .app.with-inspector { padding-right: 16px; } }
  .inspector { position: fixed; top: 0; right: 0; height: 100vh; width: 340px; max-width: 92vw; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,0.14); z-index: 50; display: flex; flex-direction: column; }
  .insp-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .insp-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .insp-body { padding: 14px 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .insp-scope { border: 0; margin: 0; padding: 0; min-inline-size: 0; display: flex; flex-direction: column; gap: 12px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
  .fld2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cell-input.bx, .cell-select.bx { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 7px; padding: 7px 9px; width: 100%; }
  .cell-input.bx:focus, .cell-select.bx:focus { border-color: var(--accent); }
  .insp-parties { min-width: 0; }
  .insp-end { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .insp-end em { color: var(--faint); font-style: normal; font-size: 11px; margin-left: 6px; }
  .insp-notes { min-height: 64px; resize: vertical; font-family: var(--font-ui); }
  .insp-warn { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px; padding: 10px 12px; }
  .insp-warn h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--warn-ink); }
  .insp-warn ul { margin: 0; padding-left: 16px; color: var(--warn-ink); font-size: 12.5px; }
  .insp-warn li { margin: 3px 0; line-height: 1.4; }
  .insp-ok { color: var(--good); font-size: 12.5px; }
  .insp-actions { display: flex; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--border); }
  .danger-btn { color: var(--danger); border-color: var(--border-strong); }
  .danger-btn:hover { border-color: var(--danger); }

  .ev-cell { display: flex; align-items: center; gap: 4px; min-width: 240px; }
  .ev-cell .cell-input { width: 100%; min-width: 210px; }
  table.grid td.col-name, table.grid th.col-name { width: 260px; }
  table.grid td.col-parties { max-width: 210px; }
  .child-tick { color: var(--faint); font-size: 13px; flex: none; }
  .btn.sm { font-size: 12px; padding: 5px 9px; }
  .insp-parent { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .insp-parent > span { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; font-weight: 600; }
  .link-btn { border: none; background: none; color: var(--accent); font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }
  .insp-inherit { font-size: 13px; color: var(--ink); padding: 7px 2px; }
  .insp-inherit em { color: var(--faint); font-style: normal; font-size: 11px; margin-left: 6px; }

                <rect x={it.x + 9} y={it.ly - 9} width={w} height={18} rx={5} style={{ fill: "var(--surface)", stroke: colorOf[focusParty] || "var(--border)" }} strokeWidth="1.3" />
                <text x={it.x + 15} y={it.ly + 3.5} fontSize="10.5" fontWeight="600" style={{ fill: "var(--ink)" }}>{it.text}</text>
              </g>
            );
          }) : null}

          {places.map((pl, i) => (
            <g key={"hdr" + pl.id} style={{ cursor: editable ? "grab" : "default" }} className="col-header"
              onPointerDown={e => headerDown(e, pl.id)} onPointerMove={headerMove} onPointerUp={headerUp}>
              <rect x={colX(i) - COL_GAP * 0.46} y={4} width={COL_GAP * 0.92} height={PAD_TOP - 12} rx={6}
                style={{ fill: dragId === pl.id ? "var(--accent-soft)" : "var(--surface)", stroke: dragId === pl.id ? "var(--accent)" : "var(--border)" }} strokeWidth="1" />
              <text x={colX(i)} y={30} textAnchor="middle" fontSize="11.5" fontWeight="700" style={{ fill: "var(--ink)", pointerEvents: "none" }}>{trunc(pl.name, 16)}<title>{pl.name}</title></text>
              {editable ? (
                <g style={{ pointerEvents: "none" }}>
                  {[0, 1, 2].map(gx => [0, 1].map(gy => (<circle key={gx + "-" + gy} cx={colX(i) - 5 + gx * 5} cy={42 + gy * 5} r={1.3} style={{ fill: "var(--faint)" }} />)))}
                </g>
              ) : null}
            </g>
          ))}
        </svg>
      </div>

      {skipped > 0 ? (<p className="map-note">{skipped} {skipped === 1 ? "row is" : "rows are"} not shown because they have no time, no place, or no event to sit on.</p>) : null}

      <div className="legend">
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="7" strokeLinecap="round" /></svg> confirmed</span>
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="5" strokeOpacity="0.62" strokeLinecap="round" /></svg> provisional</span>
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="5" strokeDasharray="10 7" strokeLinecap="round" /></svg> unbooked</span>
        <span className="li"><svg width="40" height="16" aria-hidden="true"><line x1="4" y1="13" x2="36" y2="3" style={{ stroke: "var(--ink)" }} strokeWidth="3" strokeLinecap="round" /></svg> travel between places</span>
        <span className="li"><svg width="18" height="14" aria-hidden="true"><circle cx="9" cy="7" r="4.5" style={{ fill: "var(--surface)", stroke: "var(--ink)" }} strokeWidth="2" /></svg> sub event on a line</span>
        <span className="li"><svg width="18" height="14" aria-hidden="true"><circle cx="9" cy="7" r="4.5" style={{ fill: "var(--surface)", stroke: "var(--ink)" }} strokeWidth="3.4" /></svg> pinned sub event</span>
        <span className="li"><svg width="18" height="14" aria-hidden="true"><circle cx="9" cy="7" r="3.2" style={{ fill: "var(--surface)", stroke: "var(--ink)" }} strokeWidth="1.6" strokeOpacity="0.7" /></svg> where a sub event ends</span>
        <span className="li"><svg width="34" height="10" aria-hidden="true"><line x1="2" y1="5" x2="32" y2="5" style={{ stroke: "var(--ink)" }} strokeWidth="2.5" strokeOpacity="0.32" strokeDasharray="1 7" strokeLinecap="round" /></svg> continues, not planned</span>
      </div>
    </div>
  );
}

/* ================= shared editor bits ================= */
function VendorBlock({ row, onUpdate }) {
  const vendor = row.vendor || { name: "", contact: "", phone: "", email: "" };
  const links = row.links || [];
  return (
    <React.Fragment>
      <div className="fld"><span>Vendor</span>
        <div className="vendor-grid">
          <input className="cell-input bx" placeholder="name" value={vendor.name} onChange={e => onUpdate({ vendor: { ...vendor, name: e.target.value } })} />
          <input className="cell-input bx" placeholder="contact" value={vendor.contact} onChange={e => onUpdate({ vendor: { ...vendor, contact: e.target.value } })} />
          <input className="cell-input bx" placeholder="phone" value={vendor.phone} onChange={e => onUpdate({ vendor: { ...vendor, phone: e.target.value } })} />
          <input className="cell-input bx" placeholder="email" value={vendor.email} onChange={e => onUpdate({ vendor: { ...vendor, email: e.target.value } })} />
        </div>
      </div>
      <div className="fld"><span>Links</span>
        <div className="links-list">
          {links.map((l, i) => (
            <div className="link-row" key={i}>
              <input className="cell-input bx" placeholder="label" value={l.label} onChange={e => { const nl = links.map((x, j) => j === i ? { ...x, label: e.target.value } : x); onUpdate({ links: nl }); }} />
              <input className="cell-input bx" placeholder="https://" value={l.url} onChange={e => { const nl = links.map((x, j) => j === i ? { ...x, url: e.target.value } : x); onUpdate({ links: nl }); }} />
              <button className="icon-btn danger" title="Remove link" onClick={() => onUpdate({ links: links.filter((_, j) => j !== i) })}>{"✕"}</button>
            </div>
          ))}
          <button className="btn subtle sm" onClick={() => onUpdate({ links: [...links, { label: "", url: "" }] })}>Add link</button>
        </div>
      </div>
    </React.Fragment>
  );
}

function CallTimes({ row, parties, onUpdate }) {
  const callTimes = row.callTimes || {};
  if (!(row.parties || []).length) return <div className="fld"><span>Call times</span><div className="insp-inherit"><em>Add parties to set their call times.</em></div></div>;
  return (
    <div className="fld"><span>Call times</span>
      <div className="calltimes">
        {(row.parties || []).map(pid => {
          const party = parties.find(p => p.id === pid); if (!party) return null;
          const val = callTimes[pid];
          return (
            <div className="ct-row" key={pid}>
              <span className="ct-name"><span className="ct-dot" style={{ background: party.color }}></span>{party.name}</span>
              <input className="cell-input bx time" style={{ width: "96px" }} key={pid + "_" + (val == null ? "n" : val)} defaultValue={val == null ? "" : fmtTime(val)}
                placeholder={party.callTime != null ? fmtTime(party.callTime) : "call time"}
                onBlur={e => { const v = parseTime(e.target.value); if (v === undefined) { e.target.value = val == null ? "" : fmtTime(val); return; } const ct = { ...callTimes }; if (v === null) delete ct[pid]; else ct[pid] = v; onUpdate({ callTimes: ct }); }}
                onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
            </div>
          );
        })}
        <p className="ct-hint">The greyed time is each party's default call time. Type here to set one just for this row.</p>
      </div>
    </div>
  );
}
/* ================= Inspector ================= */
function Inspector({ kind, row, events, subEvents, parties, places, resolved, warnings, editable, onUpdate, onDuplicate, onDelete, onClose, onAddSubEvent, onSelect, onUpdatePlace, onUpdateParty }) {
  if (!row) return null;
  const r = resolved[row.id] || {};

  if (kind === "event") {
    const event = row;
    const locPlace = event.location ? places.find(p => p.id === event.location) : null;
    const kids = subEvents.filter(m => m.event === event.id).slice().sort((a, b) => { const ra = resolved[a.id] || {}, rb = resolved[b.id] || {}; return (ra.start == null ? 1e9 : ra.start) - (rb.start == null ? 1e9 : rb.start); });
    const toggleParty = pid => { const has = (event.parties || []).includes(pid); onUpdate({ parties: has ? event.parties.filter(p => p !== pid) : [...(event.parties || []), pid] }); };
    return (
      <aside className="inspector" role="complementary" aria-label="Event details">
        <div className="insp-head">
          <h3>{editable ? "Event details" : "Event details (view only)"}</h3>
          <button className="icon-btn" title="Close" onClick={onClose}>{"✕"}</button>
        </div>
        <div className="insp-body">
          <fieldset className="insp-scope" disabled={!editable}>
          <p className="ct-hint">An event is one group, at one place, for a stretch of time. It is the line on the map.</p>
          <label className="fld"><span>Label</span>
            <input className="cell-input bx" value={event.label} placeholder={eventName({ ...event, label: "" }, places)} onChange={e => onUpdate({ label: e.target.value })} />
          </label>
          <div className="fld2">
            <label className="fld"><span>Type</span>
              <select className="cell-select bx" value={event.type} onChange={e => onUpdate({ type: e.target.value })}>
                <option value="event">event</option><option value="travel">travel</option>
              </select>
            </label>
            <label className="fld"><span>Status</span>
              <select className={"cell-select bx status-sel st-" + event.status} value={event.status} onChange={e => onUpdate({ status: e.target.value })}>
                <option value="confirmed">confirmed</option><option value="provisional">provisional</option><option value="unbooked">unbooked</option>
              </select>
            </label>
          </div>
          <div className="fld"><span>Who is here</span>
            <div className="parties-cell insp-parties">
              {parties.map(p => { const on = (event.parties || []).includes(p.id); return (
                <span key={p.id} className={"pchip" + (on ? " on" : "")} style={on ? { background: p.color } : {}} onClick={() => editable && toggleParty(p.id)} title={p.name}>
                  <span className="dot" style={{ background: on ? "#fff" : p.color }}></span>{p.name}
                </span>); })}
            </div>
          </div>
          <div className="fld"><span>{event.type === "travel" ? "Arrives at" : "Place"}</span>
            <select className="cell-select bx" value={event.location || ""} onChange={e => onUpdate({ location: e.target.value || null })}>
              <option value="">(none)</option>
              {places.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div className="fld"><span>Starts after</span>
            <div className="after-row">
              <select className="cell-select bx" value={event.follows || ""} onChange={e => onUpdate({ follows: e.target.value || null })}>
                <option value="">nothing, use a set start time</option>
                {events.filter(o => o.id !== event.id).map(o => <option key={o.id} value={o.id}>{eventName(o, places)}</option>)}
              </select>
              {event.follows ? (
                <span className="after-gap"><span className="plus">+</span>
                  <input className="cell-input bx" type="number" style={{ width: "62px" }} value={event.gap == null ? "" : event.gap} placeholder="0"
                    onChange={e => { const v = e.target.value; onUpdate({ gap: v === "" ? null : parseInt(v, 10) || 0 }); }} />
                  <span className="mins">min after it ends</span></span>
              ) : null}
            </div>
          </div>
          <div className="fld2">
            <label className="fld"><span>Start</span>
              <input className="cell-input bx time" key={event.id + "_" + (event.start == null ? "n" : event.start)} defaultValue={fmtTime(event.start)} placeholder={event.follows ? "auto" : "9:00 am"}
                onBlur={e => { const v = parseTime(e.target.value); if (v === undefined) { e.target.value = fmtTime(event.start); return; } onUpdate({ start: v }); }}
                onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
            </label>
            <label className="fld"><span>Duration (min)</span>
              <input className="cell-input bx dur" type="number" min="0" value={event.duration == null ? "" : event.duration}
                onChange={e => { const v = e.target.value; onUpdate({ duration: v === "" ? 0 : Math.max(0, parseInt(v, 10) || 0) }); }} />
            </label>
          </div>
          <div className="fld"><span>End</span><div className="insp-end">{r.end == null ? "not set" : fmtTime(r.end)} <em>computed</em></div></div>
          <label className="fld"><span>Notes</span>
            <textarea className="cell-input bx insp-notes" value={event.notes} onChange={e => onUpdate({ notes: e.target.value })} />
          </label>
          <div className="fld2">
            <label className="fld"><span>Owner</span>
              <input className="cell-input bx" value={event.owner || ""} placeholder="who runs this" onChange={e => onUpdate({ owner: e.target.value })} />
            </label>
            <label className="fld"><span>Buffer (min)</span>
              <input className="cell-input bx" type="number" min="0" value={event.buffer == null ? "" : event.buffer} placeholder="padding" onChange={e => { const v = e.target.value; onUpdate({ buffer: v === "" ? null : Math.max(0, parseInt(v, 10) || 0) }); }} />
            </label>
          </div>
          <VendorBlock row={event} onUpdate={onUpdate} />
          <CallTimes row={event} parties={parties} onUpdate={onUpdate} />
          {locPlace ? (
            <div className="fld"><span>Place details</span>
              <div className="loc-details">
                <div className="loc-name">{locPlace.name}</div>
                <input className="cell-input bx" placeholder="address" value={locPlace.address || ""} onChange={e => onUpdatePlace(locPlace.id, { address: e.target.value })} />
                <input className="cell-input bx" placeholder="site contact" value={locPlace.contact || ""} onChange={e => onUpdatePlace(locPlace.id, { contact: e.target.value })} />
              </div>
            </div>
          ) : null}
          <details className="party-defaults">
            <summary>Party default call times</summary>
            <div className="pd-list">
              {parties.map(p => (
                <div className="ct-row" key={p.id}>
                  <span className="ct-name"><span className="ct-dot" style={{ background: p.color }}></span>{p.name}</span>
                  <input className="cell-input bx time" style={{ width: "96px" }} key={p.id + "_" + (p.callTime == null ? "n" : p.callTime)} defaultValue={p.callTime == null ? "" : fmtTime(p.callTime)} placeholder="default"
                    onBlur={e => { const v = parseTime(e.target.value); if (v === undefined) { e.target.value = p.callTime == null ? "" : fmtTime(p.callTime); return; } onUpdateParty(p.id, { callTime: v }); }}
                    onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
                </div>
              ))}
            </div>
          </details>
          </fieldset>

          {warnings && warnings.length > 0 ? (
            <div className="insp-warn"><h4>Warnings</h4><ul>{warnings.map((w, i) => <li key={i}>{w}</li>)}</ul></div>
          ) : (<div className="insp-ok">{"✓"} No warnings for this event.</div>)}

          <div className="insp-subs">
            <div className="insp-subs-head">
              <span>Sub events on this line {kids.length ? "(" + kids.length + ")" : ""}</span>
              {editable ? <button className="btn subtle sm" onClick={() => onAddSubEvent(event.id, null)}>Add sub event</button> : null}
            </div>
            {kids.length ? (
              <ul className="sub-list">
                {kids.map(c => { const cr = resolved[c.id] || {}; return (
                  <li key={c.id}>
                    <button className="sub-item" onClick={() => onSelect(c.id)}>
                      <span className={"sub-kind " + (c.pinned ? "phase" : "moment")}>{c.pinned ? "pinned" : "floats"}</span>
                      <span className="sub-name">{c.name || "unnamed"}</span>
                      <span className="sub-time">{cr.start != null ? fmtTime(cr.start) : ""}{c.duration > 0 && cr.end != null ? " to " + fmtTime(cr.end) : ""}</span>
                    </button>
                  </li>); })}
              </ul>
            ) : (<p className="sub-empty">{editable ? "Nothing scheduled inside this event yet. Add sub events as you learn them, or click this line on the map at the time it happens." : "Nothing scheduled inside this event."}</p>)}
          </div>

          {editable ? (
            <div className="insp-actions">
              <button className="btn" onClick={onDuplicate}>Duplicate</button>
              <button className="btn danger-btn" onClick={onDelete}>Delete</button>
            </div>
          ) : null}
        </div>
      </aside>
    );
  }

  // sub event
  const mo = row;
  const host = events.find(s => s.id === mo.event) || null;
  const hostRes = host ? (resolved[host.id] || {}) : {};
  const toggleParty = pid => { const has = (mo.parties || []).includes(pid); onUpdate({ parties: has ? mo.parties.filter(p => p !== pid) : [...(mo.parties || []), pid] }); };
  const setStartFromInput = v => { if (mo.pinned) onUpdate({ start: v }); else if (hostRes.start != null && v != null) onUpdate({ offset: v - hostRes.start }); };
  return (
    <aside className="inspector" role="complementary" aria-label="Sub event details">
      <div className="insp-head">
        <h3>{editable ? "Sub event details" : "Sub event details (view only)"}</h3>
        <button className="icon-btn" title="Close" onClick={onClose}>{"✕"}</button>
      </div>
      <div className="insp-body">
        <div className="insp-parent">
          <span>On the line</span>
          {host ? <button className="link-btn" onClick={() => onSelect(host.id)}>{eventName(host, places)}</button> : <em>no event</em>}
        </div>
        <fieldset className="insp-scope" disabled={!editable}>
        <label className="fld"><span>What happens</span>
          <input className="cell-input bx" value={mo.name} placeholder="bride hair done, dinner served" onChange={e => onUpdate({ name: e.target.value })} />
        </label>
        <div className="fld"><span>On event</span>
          <select className="cell-select bx" value={mo.event || ""} onChange={e => onUpdate({ event: e.target.value || null })}>
            <option value="">(none)</option>
            {events.map(s => <option key={s.id} value={s.id}>{eventName(s, places) + " " + fmtTime((resolved[s.id] || {}).start)}</option>)}
          </select>
        </div>
        <div className="fld"><span>Who</span>
          <div className="parties-cell insp-parties">
            {(host ? parties.filter(p => (host.parties || []).includes(p.id)) : parties).map(p => { const on = (mo.parties || []).includes(p.id); return (
              <span key={p.id} className={"pchip" + (on ? " on" : "")} style={on ? { background: p.color } : {}} onClick={() => editable && toggleParty(p.id)} title={p.name}>
                <span className="dot" style={{ background: on ? "#fff" : p.color }}></span>{p.name}
              </span>); })}
          </div>
        </div>
        <div className="fld"><span>Time behaviour</span>
          <div className="after-row">
            <select className="cell-select bx" value={mo.pinned ? "pinned" : "float"}
              onChange={e => { const pin = e.target.value === "pinned";
                if (pin) onUpdate({ pinned: true, start: r.start != null ? r.start : (hostRes.start != null ? hostRes.start + (mo.offset || 0) : null) });
                else onUpdate({ pinned: false, offset: (r.start != null && hostRes.start != null) ? r.start - hostRes.start : 0, start: null }); }}>
              <option value="float">floats, rides along when the event moves</option>
              <option value="pinned">pinned, holds this clock time</option>
            </select>
          </div>
          <p className="ct-hint">{mo.pinned ? "Dinner at 7:00 no matter what." : "Keeps its gap from the start of the event, currently " + (mo.offset || 0) + " min in."}</p>
        </div>
        <div className="fld2">
          <label className="fld"><span>Start</span>
            <input className="cell-input bx time" key={mo.id + "_" + (r.start == null ? "n" : r.start)} defaultValue={fmtTime(r.start)} placeholder="9:00 am"
              onBlur={e => { const v = parseTime(e.target.value); if (v === undefined || v === null) { e.target.value = fmtTime(r.start); return; } setStartFromInput(v); }}
              onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
          </label>
          <label className="fld"><span>Duration (min)</span>
            <input className="cell-input bx dur" type="number" min="0" value={mo.duration == null ? "" : mo.duration}
              onChange={e => { const v = e.target.value; onUpdate({ duration: v === "" ? 0 : Math.max(0, parseInt(v, 10) || 0) }); }} />
          </label>
        </div>
        <div className="fld"><span>End</span><div className="insp-end">{mo.duration > 0 ? (r.end == null ? "not set" : fmtTime(r.end)) : "a point in time"} <em>computed</em></div></div>
        <label className="fld"><span>Status</span>
          <select className={"cell-select bx status-sel st-" + mo.status} value={mo.status} onChange={e => onUpdate({ status: e.target.value })}>
            <option value="confirmed">confirmed</option><option value="provisional">provisional</option><option value="unbooked">unbooked</option>
          </select>
        </label>
        <label className="fld"><span>Notes</span>
          <textarea className="cell-input bx insp-notes" value={mo.notes} onChange={e => onUpdate({ notes: e.target.value })} />
        </label>
        <label className="fld"><span>Owner</span>
          <input className="cell-input bx" value={mo.owner || ""} placeholder="who runs this" onChange={e => onUpdate({ owner: e.target.value })} />
        </label>
        <VendorBlock row={mo} onUpdate={onUpdate} />
        <CallTimes row={mo} parties={parties} onUpdate={onUpdate} />
        </fieldset>

        {warnings && warnings.length > 0 ? (
          <div className="insp-warn"><h4>Warnings</h4><ul>{warnings.map((w, i) => <li key={i}>{w}</li>)}</ul></div>
        ) : (<div className="insp-ok">{"✓"} No warnings for this sub event.</div>)}

        {editable ? (
          <div className="insp-actions">
            <button className="btn" onClick={onDuplicate}>Duplicate</button>
            <button className="btn danger-btn" onClick={onDelete}>Delete</button>
          </div>
        ) : null}
      </div>
    </aside>
  );
}
/* ================= App ================= */
function App() {
  /* ----- auth + cloud state ----- */
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(LOCAL_MODE);
  const [loading, setLoading] = useState(!LOCAL_MODE);
  const [docExists, setDocExists] = useState(LOCAL_MODE ? true : null);
  const [saveStatus, setSaveStatus] = useState("idle");
  const isEditor = LOCAL_MODE ? true : emailAllowed(user && user.email);
  const editable = isEditor;

  const seeded = useMemo(() => normalizeState(seedState()), []);
  const [events, setEvents] = useState(LOCAL_MODE ? seeded.events : []);
  const [subEvents, setSubEvents] = useState(LOCAL_MODE ? seeded.subEvents : []);
  const [parties, setParties] = useState(LOCAL_MODE ? seeded.parties : []);
  const [places, setPlaces] = useState(LOCAL_MODE ? seeded.places : []);
  const [selId, setSelId] = useState(null);
  const [showManager, setShowManager] = useState(false);
  const [view, setView] = useState("table");
  const [collapseTrunk, setCollapseTrunk] = useState(false);
  const [showLabels, setShowLabels] = useState(true);
  const [filter, setFilter] = useState("all");
  const [confirm, setConfirm] = useState(null);
  const [histTick, setHistTick] = useState(0);

  const applyingRemote = useRef(false);
  const lastWriteJson = useRef(null);
  const seededOnce = useRef(false);

  const resolved = useMemo(() => resolveAll(events, subEvents), [events, subEvents]);

  const warningsById = useMemo(() => {
    const map = {};
    events.forEach(s => { map[s.id] = validateEvent(s, events, places, resolved); });
    subEvents.forEach(m => { map[m.id] = validateSubEvent(m, events, parties, resolved, places); });
    return map;
  }, [events, subEvents, places, parties, resolved]);

  const allWarnings = useMemo(() => {
    const out = [];
    events.forEach(s => (warningsById[s.id] || []).forEach(m => out.push({ name: eventName(s, places), msg: m })));
    subEvents.forEach(mo => (warningsById[mo.id] || []).forEach(m => out.push({ name: mo.name || "(unnamed moment)", msg: m })));
    return out;
  }, [events, subEvents, warningsById, places]);

  /* ----- firebase: sign in state ----- */
  function signIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => window.alert("Sign in failed: " + ((e && e.message) || e))); }
  function signOut() { auth.signOut(); }
  useEffect(() => { if (LOCAL_MODE) return; const un = auth.onAuthStateChanged(u => { setUser(u); setAuthReady(true); }); return un; }, []);

  function applyRemote(n) {
    applyingHistory.current = true; applyingRemote.current = true;
    setEvents(n.events); setSubEvents(n.subEvents); setParties(n.parties); setPlaces(n.places);
    setSelId(sid => (n.events.find(x => x.id === sid) || n.subEvents.find(x => x.id === sid)) ? sid : null);
  }
  function writeState(ev, se, pa, pl) {
    if (LOCAL_MODE || !isEditor) return;

  }

  /* ----- firebase: live read ----- */
  useEffect(() => {
    if (LOCAL_MODE) return;

    }, err => { setLoading(false); setSaveStatus("error"); });
    return un;
  }, []);

  /* ----- firebase: first editor seeds an empty plan ----- */
  useEffect(() => {
    if (LOCAL_MODE || loading || docExists !== false || !isEditor || seededOnce.current) return;
    seededOnce.current = true;
    const s = normalizeState(seedState());
    applyRemote(s); writeState(s.events, s.subEvents, s.parties, s.places);
  }, [docExists, isEditor, loading]);

  /* ----- firebase: auto save on edits (editors only) ----- */
  useEffect(() => {
    if (LOCAL_MODE || !isEditor || loading) return;

    const json = JSON.stringify({ version: 4, events, subEvents, parties, places });

  }, [events, subEvents, parties, places, isEditor, loading]);

  useEffect(() => {

  }, [saveStatus]);

  /* ----- undo / redo ----- */
  const history = useRef({ past: [], future: [] });
  const applyingHistory = useRef(false);
  const prevSnap = useRef(null);
  useEffect(() => {
    const snap = { events, subEvents, parties, places };

  }, [events, subEvents, parties, places]);
  function restore(s) {
    applyingHistory.current = true;
    setEvents(s.events); setSubEvents(s.subEvents); setParties(s.parties); setPlaces(s.places);

    setHistTick(t => t + 1);
  }
  function undo() { if (!editable || !history.current.past.length) return; const prev = history.current.past.pop(); history.current.future.push({ events, subEvents, parties, places }); restore(prev); }
  function redo() { if (!editable || !history.current.future.length) return; const next = history.current.future.pop(); history.current.past.push({ events, subEvents, parties, places }); restore(next); }

  const canRedo = history.current.future.length > 0;
  useEffect(() => {
    function onKey(e) {

  /* ----- edits (all guarded so viewers cannot change anything) ----- */
  function updateEvent(id, patch) { if (!editable) return; setEvents(prev => prev.map(s => (s.id === id ? { ...s, ...patch } : s))); }
  function updateSubEvent(id, patch) { if (!editable) return; setSubEvents(prev => prev.map(m => (m.id === id ? { ...m, ...patch } : m))); }
  function addEvent(patch) {
    if (!editable) return;
    const s = normEvent({ id: newId("ev"), type: "event", label: "", parties: [], location: places[0] ? places[0].id : null, follows: null, start: null, duration: 30, status: "provisional", ...patch });
    setEvents(prev => [...prev, s]); setSelId(s.id);
  }
  function addSubEvent(eventId, mins) {
    if (!editable) return;
    const host = events.find(s => s.id === eventId); if (!host) return;
    const hr = resolved[eventId] || {}; const at = mins != null ? mins : (hr.start != null ? hr.start : null);
    const m = normSubEvent({ id: newId("sub"), name: "", event: eventId, parties: [...(host.parties || [])], pinned: false, offset: (at != null && hr.start != null) ? at - hr.start : 0, duration: 0, status: "provisional" });
    setSubEvents(prev => [...prev, m]); setSelId(m.id);
  }
  function duplicateEvent(id) {
    if (!editable) return;
    const src = events.find(s => s.id === id); if (!src) return;
    const copy = { ...src, id: newId("ev"), parties: [...(src.parties || [])], label: (src.label || eventName(src, places)) + " (copy)", follows: null };
    const idx = events.findIndex(s => s.id === id);
    setEvents(prev => { const next = [...prev]; next.splice(idx + 1, 0, copy); return next; }); setSelId(copy.id);
  }
  function duplicateSubEvent(id) {
    if (!editable) return;
    const src = subEvents.find(m => m.id === id); if (!src) return;
    const copy = { ...src, id: newId("sub"), parties: [...(src.parties || [])], name: (src.name || "moment") + " (copy)" };
    setSubEvents(prev => [...prev, copy]); setSelId(copy.id);
  }
  function deleteEvent(id) {
    setEvents(prev => prev.filter(s => s.id !== id).map(s => (s.follows === id ? { ...s, follows: null } : s)));
    setSubEvents(prev => prev.filter(m => m.event !== id));
    if (selId === id) setSelId(null);
  }
  function deleteSubEvent(id) { if (!editable) return; setSubEvents(prev => prev.filter(m => m.id !== id)); if (selId === id) setSelId(null); }

  function requestDeleteEvent(id) {
    if (!editable) return;
    const s = events.find(x => x.id === id); if (!s) return;

    const followers = events.filter(x => x.follows === id);
    const lines = [];
    if (kids.length) lines.push(kids.length + (kids.length > 1 ? " sub events on this line will also be deleted: " : " sub event on this line will also be deleted: ") + kids.map(m => m.name || "unnamed").join(", ") + ".");
    if (followers.length) lines.push(followers.length + (followers.length > 1 ? " events that start after it will lose that link: " : " event that starts after it will lose that link: ") + followers.map(x => eventName(x, places)).join(", ") + ".");
    if (lines.length) setConfirm({ title: "Delete " + eventName(s, places) + "?", lines, confirmLabel: "Delete", onConfirm: () => { deleteEvent(id); setConfirm(null); } });
    else deleteEvent(id);
  }
  function requestRemoveParty(id) {
    if (!editable) return;
    const p = parties.find(x => x.id === id); if (!p) return;
    const aEvents = events.filter(s => (s.parties || []).includes(id) || (s.callTimes && s.callTimes[id] != null));
    const aSubEvents = subEvents.filter(m => (m.parties || []).includes(id) || (m.callTimes && m.callTimes[id] != null));
    const n = aEvents.length + aSubEvents.length;
    if (n) {
      setConfirm({ title: "Remove party " + p.name + "?", lines: ["It will be taken off " + n + (n > 1 ? " rows" : " row") + " and any call times set for it there will be cleared: " + [...aEvents.map(s => eventName(s, places)), ...aSubEvents.map(m => m.name || "unnamed sub event")].join(", ") + "."], confirmLabel: "Remove", onConfirm: () => { removeParty(id); setConfirm(null); } });
    } else removeParty(id);
  }
  function requestRemovePlace(id) {
    if (!editable) return;
    const p = places.find(x => x.id === id); if (!p) return;
    const usedBy = events.filter(s => s.location === id);
    if (usedBy.length) {
      setConfirm({ title: "Remove place " + p.name + "?", lines: [usedBy.length + (usedBy.length > 1 ? " events" : " event") + " set here will lose their place, and the sub events on them lose it too: " + usedBy.map(s => eventName(s, places)).join(", ") + ".", "Its drive times to and from other places will also be removed."], confirmLabel: "Remove", onConfirm: () => { removePlace(id); setConfirm(null); } });
    } else removePlace(id);
  }
  function clearTimeline() {
    if (!editable) return;
    setConfirm({ title: "Clear the whole timeline?", lines: ["Every event and sub event will be removed. Your parties and places stay. You can undo this right after with undo."], confirmLabel: "Clear", onConfirm: () => { setEvents([]); setSubEvents([]); setSelId(null); setConfirm(null); } });
  }
  function toggleEventParty(eventId, partyId) {
    if (!editable) return;
    const s = events.find(x => x.id === eventId); const has = (s.parties || []).includes(partyId);

  }

  }

  /* ----- parties ----- */
  const PALETTE = ["#2f6fed","#12a594","#b5179e","#f59e0b","#6b7280","#d1495b","#3a0ca3","#2a9d8f"];
  function addParty() { if (!editable) return; setParties(prev => [...prev, { id: newId("p"), name: "New party", color: PALETTE[prev.length % PALETTE.length], laneOrder: prev.length, callTime: null }]); }
  function updateParty(id, patch) { if (!editable) return; setParties(prev => prev.map(p => (p.id === id ? { ...p, ...patch } : p))); }
  function removeParty(id) {
    setParties(prev => prev.filter(p => p.id !== id).sort((a, b) => a.laneOrder - b.laneOrder).map((p, i) => ({ ...p, laneOrder: i })));
    const strip = row => { const ct = { ...(row.callTimes || {}) }; if (ct[id] != null) delete ct[id]; return { ...row, parties: (row.parties || []).filter(pid => pid !== id), callTimes: ct }; };
    setEvents(prev => prev.map(strip)); setSubEvents(prev => prev.map(strip));
  }
  function moveParty(id, dir) {
    if (!editable) return;
    setParties(prev => { const sorted = [...prev].sort((a, b) => a.laneOrder - b.laneOrder); const i = sorted.findIndex(p => p.id === id); const j = i + dir; if (i < 0 || j < 0 || j >= sorted.length) return prev; const tmp = sorted[i]; sorted[i] = sorted[j]; sorted[j] = tmp; return sorted.map((p, k) => ({ ...p, laneOrder: k })); });
  }

  /* ----- places ----- */
  function addPlace() { if (!editable) return; setPlaces(prev => [...prev, { id: newId("pl"), name: "New place", drives: {}, address: "", contact: "" }]); }
  function updatePlace(id, patch) { if (!editable) return; setPlaces(prev => prev.map(p => (p.id === id ? { ...p, ...patch } : p))); }
  function movePlace(id, dir) { if (!editable) return; setPlaces(prev => { const i = prev.findIndex(p => p.id === id); const j = i + dir; if (i < 0 || j < 0 || j >= prev.length) return prev; const next = [...prev]; const tmp = next[i]; next[i] = next[j]; next[j] = tmp; return next; }); }
  function movePlaceTo(id, index) { if (!editable) return; setPlaces(prev => { const from = prev.findIndex(p => p.id === id); if (from < 0 || index < 0 || index >= prev.length || index === from) return prev; const next = [...prev]; const [it] = next.splice(from, 1); next.splice(index, 0, it); return next; }); }

  }
  function setDrive(fromId, toId, val) {

  }

  /* ----- backups (download only, cloud is the real save) ----- */
  function downloadFile(name, text, type) {

  }
  function downloadBackup() { downloadFile("wedding-day-lines-backup.json", JSON.stringify({ version: 4, events, subEvents, parties, places }, null, 2), "application/json"); }
  function downloadCsv() { downloadFile("wedding-day-lines.csv", buildCsv(events, subEvents, parties, places, resolved), "text/csv"); }

  const selEvent = events.find(s => s.id === selId) || null;
  const selSubEvent = selEvent ? null : (subEvents.find(m => m.id === selId) || null);
  const selKind = selEvent ? "event" : (selSubEvent ? "subEvent" : null);
  const placeLabel = id => { const p = places.find(x => x.id === id); return p ? p.name : ""; };

  /* ----- overview ----- */
  const rows = [...events, ...subEvents];
  const statPlaced = rows.filter(s => { const r = resolved[s.id]; return r && r.start != null && r.end != null; });
  let firstRow = null, lastRow = null;
  statPlaced.forEach(s => { const r = resolved[s.id]; if (!firstRow || r.start < resolved[firstRow.id].start) firstRow = s; if (!lastRow || r.end > resolved[lastRow.id].end) lastRow = s; });
  const rowName = s => (s ? (s.event !== undefined ? (s.name || "unnamed sub event") : eventName(s, places)) : "");
  const spanMin = (firstRow && lastRow) ? (resolved[lastRow.id].end - resolved[firstRow.id].start) : 0;
  const spanFmt = Math.floor(spanMin / 60) + "h " + (spanMin % 60) + "m";
  const statusCounts = { confirmed: 0, provisional: 0, unbooked: 0 };
  rows.forEach(s => { if (statusCounts[s.status] != null) statusCounts[s.status]++; });
  const statusTotal = rows.length || 1;
  const pct = n => (n / statusTotal * 100);
  const rowMatches = s => filter === "all" || s.status !== "confirmed";

  const startOf = s => { const r = resolved[s.id]; return (r && r.start != null) ? r.start : 1e9; };
  const byStart = (a, b) => startOf(a) - startOf(b);
  const sectionDefs = [
    { key: "morning", label: "Morning", test: m => m < 720 },
    { key: "afternoon", label: "Afternoon", test: m => m >= 720 && m < 1020 },

    { key: "unscheduled", label: "Unscheduled", test: null },

  const bucketOf = t => { const st = startOf(t); if (st >= 1e9) return "unscheduled"; const d = sectionDefs.find(sd => sd.test && sd.test(st)); return d ? d.key : "evening"; };
  const orphanSubEvents = subEvents.filter(m => !events.find(s => s.id === m.event));
  const sections = [];
  sectionDefs.forEach(sd => {
    const group = events.filter(t => bucketOf(t) === sd.key).sort(byStart);
    const rowsOut = [];
    group.forEach(t => { rowsOut.push({ kind: "event", row: t, depth: 0 }); subEvents.filter(m => m.event === t.id).sort(byStart).forEach(c => rowsOut.push({ kind: "subEvent", row: c, depth: 1, host: t })); });
    if (sd.key === "unscheduled") orphanSubEvents.forEach(m => rowsOut.push({ kind: "subEvent", row: m, depth: 0, host: null }));
    if (rowsOut.length) sections.push({ label: sd.label, rows: rowsOut });
  });

  /* ----- gate screens ----- */
  if (!authReady) return <div className="loading-screen">Loading&#8230;</div>;
  if (!LOCAL_MODE && loading) return <div className="loading-screen">Loading the timeline&#8230;</div>;

  const saveText = saveStatus === "saving" ? "saving…" : saveStatus === "saved" ? "all changes saved" : saveStatus === "error" ? "save failed, check your connection" : "";

    <div className={"app" + (selKind ? " with-inspector" : "")}>

          </div>
        </div>
      </section>

      </div>

        </div>

      {editable && showManager ? (
        <div className="manager">
          <div className="mgr-card">
            <div className="mgr-head"><h3>Parties</h3><button className="btn" onClick={addParty}>Add party</button></div>
            <div className="party-list">
              {parties.slice().sort((a, b) => a.laneOrder - b.laneOrder).map((p, idx, arr) => (
                <div className="party-row" key={p.id}>
                  <input type="color" className="color-input" value={p.color} title="Line color" onChange={e => updateParty(p.id, { color: e.target.value })} />
                  <input className="cell-input mgr-name" value={p.name} onChange={e => updateParty(p.id, { name: e.target.value })} />
                  <span className="lane-label">track {p.laneOrder + 1}</span>
                  <button className="icon-btn" title="Move earlier track" disabled={idx === 0} onClick={() => moveParty(p.id, -1)}>{"↑"}</button>
                  <button className="icon-btn" title="Move later track" disabled={idx === arr.length - 1} onClick={() => moveParty(p.id, 1)}>{"↓"}</button>
                  <button className="icon-btn danger" title="Remove party" onClick={() => requestRemoveParty(p.id)}>{"✕"}</button>
                </div>
              ))}
              {parties.length === 0 ? <p className="mgr-note">No parties yet. Add one to put it on an event.</p> : null}
            </div>
            <p className="mgr-note">Track order sets where each party's line sits when several parties share a place in the map. Removing a party takes it off every event and sub event it was on.</p>
          </div>
          <div className="mgr-card">
            <div className="mgr-head"><h3>Places</h3><button className="btn" onClick={addPlace}>Add place</button></div>
            <div className="place-list">
              {places.map((p, idx) => (
                <div className="place-row" key={p.id}>
                  <span className="lane-label">col {idx + 1}</span>
                  <input className="cell-input mgr-name" value={p.name} onChange={e => updatePlace(p.id, { name: e.target.value })} />
                  <button className="icon-btn" title="Move column left" disabled={idx === 0} onClick={() => movePlace(p.id, -1)}>{"↑"}</button>
                  <button className="icon-btn" title="Move column right" disabled={idx === places.length - 1} onClick={() => movePlace(p.id, 1)}>{"↓"}</button>
                  <button className="icon-btn danger" title="Remove place" onClick={() => requestRemovePlace(p.id)}>{"✕"}</button>
                </div>
              ))}
              {places.length === 0 ? <p className="mgr-note">No places yet. Add one to set it as an event's place.</p> : null}
            </div>
            {places.length > 0 ? (
              <React.Fragment>
                <h4 className="matrix-title">Drive times in minutes</h4>
                <div className="matrix-wrap">
                  <table className="matrix">
                    <thead><tr><th className="corner">from \ to</th>{places.map(p => <th key={p.id}>{p.name}</th>)}</tr></thead>
                    <tbody>
                      {places.map(from => (
                        <tr key={from.id}>
                          <th>{from.name}</th>
                          {places.map(to => (
                            <td key={to.id}>
                              {from.id === to.id ? <span className="diag">{"·"}</span> : (
                                <input className="cell-input mtx" type="number" min="0" value={from.drives && from.drives[to.id] != null ? from.drives[to.id] : ""} onChange={e => setDrive(from.id, to.id, e.target.value)} />
                              )}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </React.Fragment>
            ) : null}
            <p className="mgr-note">Places are the columns in the map, left to right in this order, so use the arrows to reorder them. Each drive cell is the time from the row place to the column place, and the travel warning uses these. Removing a place clears it from any event that used it.</p>
          </div>
        </div>
      ) : null}

      <div className="table-wrap">
        <table className="grid">
          <thead>
            <tr>
              <th>Row</th><th className="col-name">Name</th><th>Parties</th><th>Place</th><th>Time rule</th><th>Start</th><th>Duration</th><th>End</th><th>Status</th><th>Owner</th><th>Vendor</th><th>Notes</th><th className="col-warn" title="Warnings">!</th><th></th>
            </tr>
          </thead>
          <tbody>
            {sections.map(section => {
              const visRows = section.rows.filter(({ row }) => rowMatches(row));
              if (!visRows.length) return null;
              return (
                <React.Fragment key={"sec-" + section.label}>
                  <tr className="section-row"><td colSpan={14}>{section.label}</td></tr>
                  {visRows.map(item => {
                    const s = item.row; const r = resolved[s.id] || {}; const w = warningsById[s.id] || [];
                    const isMoment = item.kind === "subEvent"; const host = item.host || null; const hostRes = host ? (resolved[host.id] || {}) : {};
                    const partyOptions = isMoment && host ? parties.filter(p => (host.parties || []).includes(p.id)) : parties;
                    return (
                      <tr key={s.id} className={selId === s.id ? "sel" : ""} onClick={() => setSelId(s.id)}>
                        <td>
                          {isMoment ? (<span className="end-val" title={host ? "A sub event on " + eventName(host, places) : "This sub event has no event"}>sub event</span>) : (
                            <select className="cell-select" value={s.type} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { type: e.target.value })}><option value="event">event</option><option value="travel">travel</option></select>)}
                        </td>
                        <td className="col-name">
                          <div className="ev-cell" style={item.depth > 0 ? { paddingLeft: "12px" } : null}>
                            {item.depth > 0 ? <span className="child-tick" title={host ? "On " + eventName(host, places) : ""}>{"↳"}</span> : null}
                            {isMoment ? (
                              <input className="cell-input" value={s.name} placeholder="what happens" onClick={e => e.stopPropagation()} onChange={e => updateSubEvent(s.id, { name: e.target.value })} />
                            ) : (
                              <input className="cell-input" value={s.label} placeholder={eventName({ ...s, label: "" }, places)} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { label: e.target.value })} />
                            )}
                          </div>
                        </td>
                        <td className="col-parties">
                          <div className="parties-cell">
                            {partyOptions.map(p => { const on = (s.parties || []).includes(p.id); return (
                              <span key={p.id} className={"pchip" + (on ? " on" : "")} style={on ? { background: p.color } : {}}
                                onClick={ev => { if (!editable) return; ev.stopPropagation(); isMoment ? toggleSubEventParty(s.id, p.id) : toggleEventParty(s.id, p.id); }} title={p.name}>
                                <span className="dot" style={{ background: on ? "#fff" : p.color }}></span>{p.name}
                              </span>); })}
                          </div>
                        </td>
                        <td>
                          {isMoment ? (<span className="end-val" title="From the event it sits on">{host ? (placeLabel(host.location) || "(none)") : "(no event)"}</span>) : (
                            <select className="cell-select" value={s.location || ""} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { location: e.target.value || null })}><option value="">(none)</option>{places.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>)}
                        </td>
                        <td>
                          {isMoment ? (
                            <select className="cell-select" value={s.pinned ? "pinned" : "float"} onClick={e => e.stopPropagation()}
                              onChange={e => { const pin = e.target.value === "pinned"; if (pin) updateSubEvent(s.id, { pinned: true, start: r.start != null ? r.start : null }); else updateSubEvent(s.id, { pinned: false, start: null, offset: (r.start != null && hostRes.start != null) ? r.start - hostRes.start : 0 }); }}>
                              <option value="float">floats with event</option><option value="pinned">pinned time</option>
                            </select>
                          ) : (
                            <div className="after-cell">
                              <select className="cell-select" value={s.follows || ""} onClick={e => e.stopPropagation()} onChange={e => updateEvent(s.id, { follows: e.target.value || null })}><option value="">(none)</option>{events.filter(o => o.id !== s.id).map(o => <option key={o.id} value={o.id}>{eventName(o, places)}</option>)}</select>
                              {s.follows ? (<span className="after-mini"><span className="plus">+</span><input className="cell-input dur" type="number" min="0" style={{ width: "48px" }} value={s.gap == null ? "" : s.gap} placeholder="0" onClick={e => e.stopPropagation()} onChange={e => { const v = e.target.value; updateEvent(s.id, { gap: v === "" ? null : parseInt(v, 10) || 0 }); }} /><span className="mins">m</span></span>) : null}
                            </div>
                          )}
                        </td>
                        <td className="col-start">
                          <div className="start-cell">
                            {isMoment ? (s.pinned ? <span className="pin-dot" title="Pinned time"></span> : <span className="auto-chip" title={"Floats, " + (s.offset || 0) + " min into the event"}>{"+" + (s.offset || 0) + "m"}</span>) : (s.start != null ? <span className="pin-dot" title="Pinned start time"></span> : (s.follows ? <span className="auto-chip" title="Starts after another event">auto</span> : null))}
                            <input
                              className={"cell-input time" + ((isMoment ? s.pinned : s.start != null) ? " pinned" : " inherited")}
                              defaultValue={isMoment ? fmtTime(r.start) : fmtTime(s.start)}
                              key={s.id + "_" + (isMoment ? (r.start == null ? "n" : r.start) : (s.start == null ? "n" : s.start))}
                              placeholder={isMoment ? "set time" : (s.start == null ? (r.start != null ? fmtTime(r.start) : "set time") : "9:00 am")}
                              title={isMoment ? (s.pinned ? "Pinned. Switch to floats to let it ride along." : "Floats with the event. Typing a time changes how far into the event it sits.") : (s.start != null ? "Pinned. Clear it to fall back to starts after." : "Computed from starts after. Type a time to pin it.")}
                              onClick={e => e.stopPropagation()}
                              onBlur={e => { const v = parseTime(e.target.value);
                                if (isMoment) { if (v === undefined || v === null) { e.target.value = fmtTime(r.start); return; } if (s.pinned) updateSubEvent(s.id, { start: v }); else if (hostRes.start != null) updateSubEvent(s.id, { offset: v - hostRes.start }); }
                                else { if (v === undefined) { e.target.value = fmtTime(s.start); return; } updateEvent(s.id, { start: v }); } }}
                              onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                            />
                          </div>
                        </td>
                        <td className="col-dur">
                          <input className="cell-input dur" type="number" min="0" style={{ width: "72px" }} value={s.duration == null ? "" : s.duration} onClick={e => e.stopPropagation()} onChange={e => { const v = e.target.value; const patch = { duration: v === "" ? 0 : Math.max(0, parseInt(v, 10) || 0) }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} />
                        </td>
                        <td className="col-end">
                          <span className={"end-field" + (r.end == null ? " unset" : "")} title="Computed end, start plus duration">{isMoment && s.duration === 0 ? "point" : (r.end == null ? "not set" : fmtTime(r.end))}</span>
                        </td>
                        <td>
                          <select className={"cell-select status-sel st-" + s.status} value={s.status} onClick={e => e.stopPropagation()} onChange={e => { const patch = { status: e.target.value }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }}><option value="confirmed">confirmed</option><option value="provisional">provisional</option><option value="unbooked">unbooked</option></select>
                        </td>
                        <td><input className="cell-input" style={{ minWidth: "110px" }} value={s.owner || ""} placeholder="owner" onClick={e => e.stopPropagation()} onChange={e => { const patch = { owner: e.target.value }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} /></td>
                        <td><input className="cell-input" style={{ minWidth: "120px" }} value={(s.vendor && s.vendor.name) || ""} placeholder="vendor" onClick={e => e.stopPropagation()} onChange={e => { const patch = { vendor: { ...(s.vendor || { name: "", contact: "", phone: "", email: "" }), name: e.target.value } }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} /></td>
                        <td><input className="cell-input" style={{ minWidth: "140px" }} value={s.notes} placeholder="notes" onClick={e => e.stopPropagation()} onChange={e => { const patch = { notes: e.target.value }; isMoment ? updateSubEvent(s.id, patch) : updateEvent(s.id, patch); }} /></td>
                        <td className="col-warn">{w.length > 0 ? <span className="warnflag" title={w.join("\n")}>{"▲"}</span> : ""}</td>
                        <td>
                          {editable ? (
                            <div className="row-actions" onClick={e => e.stopPropagation()}>
                              {!isMoment ? <button className="icon-btn" title="Add a sub event on this line" onClick={() => addSubEvent(s.id, null)}>{"+"}</button> : null}
                              <button className="icon-btn" title="Duplicate row" onClick={() => (isMoment ? duplicateSubEvent(s.id) : duplicateEvent(s.id))}>{"⧉"}</button>
                              <button className="icon-btn danger" title="Delete row" onClick={() => (isMoment ? deleteSubEvent(s.id) : requestDeleteEvent(s.id))}>{"✕"}</button>
                            </div>
                          ) : null}
                        </td>
                      </tr>
                    );
                  })}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      </fieldset>
      )}

      {editable && allWarnings.length > 0 ? (
        <div className="warnings-panel"><h3>Warnings ({allWarnings.length})</h3><ul>{allWarnings.map((w, i) => (<li key={i}><b>{w.name}:</b> {w.msg}</li>))}</ul></div>
      ) : (editable ? <div className="no-warn">{"✓"} No validation warnings.</div> : null)}

      {editable ? (
        <div className="io">
          <div className="io-card">
            <h3>Saving</h3>
            <p>Your changes save to the cloud automatically and sync to every device. {saveText ? saveText.charAt(0).toUpperCase() + saveText.slice(1) + "." : ""} You do not need to do anything to keep your work. Use download backup now and then if you want a copy on your computer.</p>
            <div className="io-row">
              <button className="btn" onClick={downloadBackup}>Download backup (JSON)</button>
              <button className="btn" onClick={downloadCsv}>Export CSV</button>
            </div>
          </div>
        </div>
      ) : null}

      <div className="foot">
        <b>How time resolves:</b> an event is pinned when it has a start time, otherwise it starts when the event it follows ends, plus any gap. A sub event is either pinned to a clock time or floats, keeping its distance from the start of the event it sits on, so it rides along when that event moves. End is always start plus duration and is never editable. Times are stored as minutes from midnight and shown in 12 hour time.
      </div>

      <Inspector kind={selKind} row={selEvent || selSubEvent} events={events} subEvents={subEvents} parties={parties} places={places} resolved={resolved}
        warnings={selId ? warningsById[selId] : null} editable={editable}
        onUpdate={patch => (selKind === "event" ? updateEvent(selId, patch) : updateSubEvent(selId, patch))}
        onDuplicate={() => (selKind === "event" ? duplicateEvent(selId) : duplicateSubEvent(selId))}
        onDelete={() => (selKind === "event" ? requestDeleteEvent(selId) : deleteSubEvent(selId))}
        onClose={() => setSelId(null)} onAddSubEvent={addSubEvent} onSelect={id => setSelId(id)} onUpdatePlace={updatePlace} onUpdateParty={updateParty} />

      {confirm ? (
        <div className="modal-scrim" onClick={() => setConfirm(null)}>
          <div className="modal" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
            <h3>{confirm.title}</h3>
            <p className="modal-lead">This removes data from other rows:</p>
            <ul className="modal-lines">{confirm.lines.map((l, i) => <li key={i}>{l}</li>)}</ul>
            <div className="modal-actions">
              <button className="btn" onClick={() => setConfirm(null)}>Cancel</button>
              <button className="btn danger-btn solid" onClick={confirm.onConfirm}>{confirm.confirmLabel || "Delete"}</button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
</content>
